<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placement Portal</title>
  <link rel="manifest" href="/manifest.json">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --primary: #54B39A;
      --secondary: #6092C1;
      --accent: #D46087;
      --tertiary: #8C7BB8;
      --quaternary: #7FAFD4;
      --success: #7FB8A4;
      --warning: #E8A317;
      --danger: #D97C6F;
      --info: #6B8DAF;
      --low: #7FB8A4;
      --medium: #E8A317;
      --high: #D97C6F;
      --critical: #A30006;
      --text-dark-gray: #2c3e50;
      --text-white: #ffffff;
      --card-student: #d4e9e2;
      --card-company: #d6e2f0;
      --card-drive: #e3d7f5;
      --card-pending: #fbe8c6;
    }

    body {
      background: #f8f9fa;
      color: var(--text-dark-gray);
    }

    .navbar-admin {
      background-color: #ffffff !important;
      border-bottom: 2px solid var(--primary);
    }

    .navbar-admin .navbar-brand {
      color: var(--primary) !important;
      font-weight: 700;
    }

    .navbar-company {
      background-color: #ffffff !important;
      border-bottom: 2px solid var(--secondary);
    }

    .navbar-company .navbar-brand {
      color: var(--secondary) !important;
      font-weight: 700;
    }

    .navbar-student {
      background-color: #ffffff !important;
      border-bottom: 2px solid var(--tertiary);
    }

    .navbar-student .navbar-brand {
      color: var(--tertiary) !important;
      font-weight: 700;
    }

    .navbar-guest {
      background-color: #ffffff !important;
      border-bottom: 2px solid var(--accent);
    }

    .navbar-guest .navbar-brand {
      color: var(--accent) !important;
      font-weight: 700;
    }

    .navbar-guest .btn-outline-danger {
      border-color: var(--accent);
      color: var(--accent);
    }

    .navbar-guest .btn-outline-danger:hover {
      background-color: var(--accent);
      color: #fff;
    }

    .navbar-brand {
      font-weight: bold;
    }

    .btn-primary {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background-color: #3e8b74;
      border-color: #3e8b74;
    }

    .btn-primary:active,
    .btn-primary:focus,
    .btn-primary:focus-visible {
      background-color: #2f6e5a !important;
      border-color: #2f6e5a !important;
      box-shadow: 0 0 0 0.2rem rgba(84, 179, 154, 0.3) !important;
    }

    .btn-accent {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-accent:hover {
      background-color: #b84a6e;
      border-color: #b84a6e;
      color: #fff;
    }

    .btn-accent:active,
    .btn-accent:focus {
      background-color: #9b3e5c !important;
      border-color: #9b3e5c !important;
      box-shadow: 0 0 0 0.2rem rgba(212, 96, 135, 0.3) !important;
    }

    .btn-secondary {
      background-color: var(--secondary);
      border-color: var(--secondary);
    }

    .btn-secondary:hover {
      background-color: #4a75a0;
      border-color: #4a75a0;
    }

    .btn-success {
      background-color: var(--success);
      border-color: var(--success);
    }

    .btn-success:hover {
      background-color: #5d8c7a;
      border-color: #5d8c7a;
    }

    .btn-warning {
      background-color: var(--warning);
      border-color: var(--warning);
      color: #fff;
    }

    .btn-warning:hover {
      background-color: #c48e14;
      border-color: #c48e14;
      color: #fff;
    }

    .btn-danger {
      background-color: var(--danger);
      border-color: var(--danger);
    }

    .btn-danger:hover {
      background-color: #b85d52;
      border-color: #b85d52;
    }

    .btn-dark-gray {
      background-color: #6c757d;
      border-color: #6c757d;
      color: #fff;
    }

    .btn-dark-gray:hover {
      background-color: #5a6268;
      border-color: #545b62;
      color: #fff;
    }

    .btn-dark-gray:active,
    .btn-dark-gray:focus {
      background-color: #4e555b !important;
      border-color: #454b50 !important;
      box-shadow: 0 0 0 0.2rem rgba(108, 117, 125, 0.5) !important;
    }

    .btn-reports {
      background-color: var(--quaternary);
      border-color: var(--quaternary);
      color: var(--text-white);
    }

    .btn-reports:hover {
      background-color: #5b8fab;
      border-color: #5b8fab;
      color: var(--text-dark-gray);
    }

    .btn-reports:active,
    .btn-reports:focus,
    .btn-reports:focus-visible {
      background-color: #4a7d99 !important;
      border-color: #4a7d99 !important;
      box-shadow: 0 0 0 0.2rem rgba(127, 175, 212, 0.3) !important;
      color: #fff !important;
    }

    .btn-outline-reports {
      background-color: transparent;
      color: var(--quaternary);
      border-color: var(--quaternary);
      transition: all 0.15s ease-in-out;
    }

    .btn-outline-reports:hover {
      background-color: var(--quaternary);
      color: var(--text-dark-gray);
      border-color: var(--quaternary);
    }

    .btn-outline-reports:active,
    .btn-outline-reports.active,
    .btn-outline-reports.selected,
    .btn-outline-reports:focus-visible {
      background-color: var(--quaternary) !important;
      color: #fff !important;
      border-color: var(--quaternary) !important;
      box-shadow: none !important;
      outline: none !important;
    }

    .btn-outline-primary,
    .btn-outline-secondary,
    .btn-outline-success,
    .btn-outline-danger,
    .btn-outline-warning,
    .btn-outline-info,
    .btn-outline-company,
    .btn-outline-drive,
    .btn-outline-student {
      background-color: transparent;
      transition: all 0.15s ease-in-out;
    }

    .btn-outline-primary {
      color: var(--primary);
      border-color: var(--primary);
    }

    .btn-outline-primary:hover {
      background-color: var(--primary);
      color: var(--text-dark-gray);
      border-color: var(--primary);
    }

    .btn-outline-primary:active,
    .btn-outline-primary.active,
    .btn-outline-primary.selected,
    .btn-outline-primary:focus-visible {
      background-color: var(--primary) !important;
      color: #fff !important;
      border-color: var(--primary) !important;
      box-shadow: none !important;
      outline: none !important;
    }

    .btn-outline-success {
      color: var(--success);
      border-color: var(--success);
    }

    .btn-outline-success:hover {
      background-color: var(--success);
      color: var(--text-dark-gray);
      border-color: var(--success);
    }

    .btn-outline-success:active,
    .btn-outline-success.active,
    .btn-outline-success.selected {
      background-color: var(--success) !important;
      color: #fff !important;
      border-color: var(--success) !important;
      box-shadow: none !important;
      outline: none !important;
    }

    .btn-outline-info {
      color: var(--info);
      border-color: var(--info);
    }

    .btn-outline-info:hover {
      background-color: var(--info);
      color: var(--text-dark-gray);
      border-color: var(--info);
    }

    .btn-outline-info:active,
    .btn-outline-info.active,
    .btn-outline-info.selected {
      background-color: var(--info) !important;
      color: #fff !important;
      border-color: var(--info) !important;
      box-shadow: none !important;
      outline: none !important;
    }

    .btn-outline-company {
      background-color: transparent;
      color: #6b8cb3;
      border-color: #6b8cb3;
    }

    .btn-outline-company:hover {
      background-color: #7f9fc4;
      color: var(--text-dark-gray);
      border-color: #7f9fc4;
    }

    .btn-outline-company.active,
    .btn-outline-company.selected {
      background-color: #7f9fc4 !important;
      color: #fff !important;
      border-color: #7f9fc4 !important;
      box-shadow: none !important;
      outline: none !important;
    }

    .btn-outline-drive {
      background-color: transparent;
      color: #9575c1;
      border-color: #9575c1;
    }

    .btn-outline-drive:hover {
      background-color: #a88bcf;
      color: var(--text-dark-gray);
      border-color: #a88bcf;
    }

    .btn-outline-drive.active,
    .btn-outline-drive.selected {
      background-color: #a88bcf !important;
      color: #fff !important;
      border-color: #a88bcf !important;
      box-shadow: none !important;
      outline: none !important;
    }

    .btn-outline-student {
      background-color: transparent;
      color: #709e87;
      border-color: #709e87;
    }

    .btn-outline-student:hover {
      background-color: #84b39c;
      color: var(--text-dark-gray);
      border-color: #84b39c;
    }

    .btn-outline-student.active,
    .btn-outline-student.selected {
      background-color: #84b39c !important;
      color: #fff !important;
      border-color: #84b39c !important;
      box-shadow: none !important;
      outline: none !important;
    }

    .btn-outline-danger {
      color: var(--danger);
      border-color: var(--danger);
    }

    .btn-outline-danger:hover {
      background-color: var(--danger);
      color: var(--text-dark-gray);
      border-color: var(--danger);
    }

    .btn-outline-danger:active,
    .btn-outline-danger.active,
    .btn-outline-danger.selected {
      background-color: var(--danger) !important;
      color: #fff !important;
      border-color: var(--danger) !important;
      box-shadow: none !important;
      outline: none !important;
    }

    .btn-company {
      background-color: #7f9fc4;
      border-color: #7f9fc4;
      color: var(--text-white);
    }

    .btn-company:hover {
      background-color: #6b8cb3;
      border-color: #6b8cb3;
      color: var(--text-dark-gray);
    }

    .btn-drive {
      background-color: #a88bcf;
      border-color: #a88bcf;
      color: var(--text-white);
    }

    .btn-drive:hover {
      background-color: #9575c1;
      border-color: #9575c1;
      color: var(--text-dark-gray);
    }

    .btn-student {
      background-color: #84b39c;
      border-color: #84b39c;
      color: var(--text-white);
    }

    .btn-student:hover {
      background-color: #709e87;
      border-color: #709e87;
      color: var(--text-dark-gray);
    }

    .btn-outline-reports,
    .btn-outline-reports:focus,
    .btn-outline-reports:active,
    .btn-outline-primary,
    .btn-outline-primary:focus,
    .btn-outline-primary:active,
    .btn-reports,
    .btn-reports:focus,
    .btn-reports:active,
    .btn-primary,
    .btn-primary:focus,
    .btn-primary:active {
      box-shadow: none !important;
    }

    .btn:disabled,
    .btn.disabled,
    fieldset:disabled .btn {
      opacity: 0.5;
      pointer-events: none;
    }

    .btn-primary:disabled,
    .btn-primary.disabled {
      background-color: var(--primary) !important;
      border-color: var(--primary) !important;
    }

    .btn-success:disabled,
    .btn-success.disabled {
      background-color: var(--success) !important;
      border-color: var(--success) !important;
    }

    .btn-warning:disabled,
    .btn-warning.disabled {
      background-color: var(--warning) !important;
      border-color: var(--warning) !important;
      color: #fff !important;
    }

    .btn-danger:disabled,
    .btn-danger.disabled {
      background-color: var(--danger) !important;
      border-color: var(--danger) !important;
    }

    .btn-dark-gray:disabled,
    .btn-dark-gray.disabled {
      background-color: #6c757d !important;
      border-color: #6c757d !important;
      color: #fff !important;
    }

    .btn-reports:disabled,
    .btn-reports.disabled {
      background-color: var(--quaternary) !important;
      border-color: var(--quaternary) !important;
      color: var(--text-white) !important;
    }

    .btn-accent:disabled,
    .btn-accent.disabled {
      background-color: var(--accent) !important;
      border-color: var(--accent) !important;
      color: #fff !important;
    }

    .btn-outline-reports:disabled,
    .btn-outline-primary:disabled,
    .btn-outline-success:disabled,
    .btn-outline-info:disabled,
    .btn-outline-company:disabled,
    .btn-outline-drive:disabled,
    .btn-outline-student:disabled,
    .btn-outline-danger:disabled,
    .btn-outline-warning:disabled {
      background-color: transparent !important;
      opacity: 0.5;
    }

    .card {
      border: none;
      border-radius: 10px;
    }

    .table-responsive {
      margin-bottom: 1.5rem;
    }

    .stat-card {
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      height: 100%;
    }

    .stat-card .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-card h5 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
      color: var(--text-dark-gray);
      font-weight: 700;
    }

    .stat-card h2 {
      font-size: 2rem;
      margin: 0;
      font-weight: 700;
      color: var(--text-dark-gray);
    }

    .card-students {
      background-color: var(--card-student);
    }

    .card-companies {
      background-color: var(--card-company);
    }

    .card-drives {
      background-color: var(--card-drive);
    }

    .card-pending {
      background-color: var(--card-pending);
    }

    .chart-container {
      position: relative;
      height: 300px;
      width: 100%;
    }

    .text-status-applied {
      color: #6c8ebf !important;
      font-weight: normal;
    }

    .status-text {
      font-weight: normal;
    }
  </style>
</head>

<body>
  <div id="app">
    <nav class="navbar navbar-expand-lg navbar-light shadow-sm" :class="navbarClass" v-if="true">
      <div class="container">
        <a class="navbar-brand" href="#">Placement Portal</a>
        <div class="navbar-nav ms-auto">
          <template v-if="!token">
            <router-link class="nav-link" to="/login">Login</router-link>
            <router-link class="nav-link" to="/register/student">Student Register</router-link>
            <router-link class="nav-link" to="/register/company">Company Register</router-link>
          </template>
          <button v-if="token" class="btn btn-sm btn-outline-danger" @click="logout">Logout</button>
        </div>
      </div>
    </nav>
    <div class="container mt-4">
      <router-view></router-view>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    {% raw %}
    const { createApp, ref, computed, onMounted } = Vue;
    const { createRouter, createWebHashHistory } = VueRouter;

    axios.interceptors.request.use(config => {
      const token = localStorage.getItem('token');
      if (token) config.headers.Authorization = `Bearer ${token}`;
      return config;
    });

    const backArrowSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
  <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
</svg>`;

    const PublicDashboard = {
      template: `
        <div>
          <div class="row mb-4">
            <div class="col-md-3"><div class="card stat-card card-students"><div class="card-body"><h5>Students</h5><h2>{{ stats.total_students }}</h2></div></div></div>
            <div class="col-md-3"><div class="card stat-card card-companies"><div class="card-body"><h5>Companies</h5><h2>{{ stats.total_companies }}</h2></div></div></div>
            <div class="col-md-3"><div class="card stat-card card-drives"><div class="card-body"><h5>Drives</h5><h2>{{ stats.total_drives }}</h2></div></div></div>
            <div class="col-md-3"><div class="card stat-card" style="background-color: #d4edda;"><div class="card-body"><h5>Placements</h5><h2>{{ stats.total_selected }}</h2></div></div></div>
          </div>
          <div class="row align-items-center">
            <div class="col-md-6 text-center">
              <img src="/static/images/At the office-amico.svg" alt="Placement illustration" class="img-fluid" style="max-height: 420px;">
            </div>
            <div class="col-md-6">
              <h4>Welcome to the Placement Portal</h4>
              <p>Track campus recruitment activities, apply for placements, and manage drives.</p>
              <p>
                <router-link to="/login" class="btn btn-accent">Login</router-link>
                <router-link to="/register/student" class="btn btn-outline-accent ms-2">Register as Student</router-link>
                <router-link to="/register/company" class="btn btn-outline-accent ms-2">Register as Company</router-link>
              </p>
            </div>
          </div>
        </div>`,
      data() {
        return { stats: { total_students: 0, total_companies: 0, total_drives: 0, total_selected: 0 } };
      },
      async mounted() {
        try {
          const { data } = await axios.get('/api/public/stats');
          this.stats = data;
        } catch (e) { console.error(e); }
      }
    };

    const Login = {
      template: `
      <div class="row justify-content-center">
        <div class="col-md-4">
          <router-link to="/" class="text-decoration-none d-inline-flex align-items-center gap-1" style="color: #6c757d;">
            ${backArrowSvg} Back to Home
          </router-link>
          <div class="card p-4 shadow-sm mt-2">
            <h3 class="text-center" style="color: var(--accent);">Login</h3>
            <form @submit.prevent="doLogin">
              <div class="mb-3"><input v-model="email" type="email" class="form-control" placeholder="Email" required></div>
              <div class="mb-3"><input v-model="password" type="password" class="form-control" placeholder="Password" required minlength="6"></div>
              <button type="submit" class="btn btn-accent w-100">Login</button>
            </form>
            <p class="mt-3 text-center">New student? <router-link to="/register/student">Register</router-link></p>
            <p class="text-center">Company? <router-link to="/register/company">Register</router-link></p>
          </div>
        </div>
      </div>`,
      data() { return { email: '', password: '' }; },
      methods: {
        async doLogin() {
          try {
            const res = await axios.post('/api/login', { email: this.email, password: this.password });
            localStorage.setItem('token', res.data.access_token);
            localStorage.setItem('role', res.data.role);
            this.$root.updateAuth();
            this.$router.push('/' + res.data.role);
          } catch (e) {
            alert(e.response?.data?.msg || 'Login failed');
          }
        }
      }
    };

    const RegisterStudent = {
      template: `
      <div class="row justify-content-center">
        <div class="col-md-6">
          <router-link to="/" class="text-decoration-none d-inline-flex align-items-center gap-1" style="color: #6c757d;">
            ${backArrowSvg} Back to Home
          </router-link>
          <div class="card p-4 shadow-sm mt-2">
            <h3 style="color: var(--accent);">Student Registration</h3>
            <form @submit.prevent="register">
              <div class="mb-3"><input v-model="name" class="form-control" placeholder="Full Name" required></div>
              <div class="mb-3"><input v-model="email" type="email" class="form-control" placeholder="Email" required></div>
              <div class="mb-3"><input v-model="password" type="password" class="form-control" placeholder="Password" required minlength="6"></div>
              <div class="mb-3"><input v-model="roll" class="form-control" placeholder="Roll Number"></div>
              <div class="mb-3"><input v-model="branch" class="form-control" placeholder="Branch"></div>
              <div class="mb-3"><input v-model="cgpa" class="form-control" placeholder="CGPA" type="number" step="0.01" min="0" max="10"></div>
              <div class="mb-3"><input v-model="year" class="form-control" placeholder="Graduation Year" type="number" min="2000" max="2099"></div>
              <button class="btn btn-accent w-100">Register</button>
            </form>
            <p class="mt-3 text-center">Already have an account? <router-link to="/login">Login</router-link></p>
          </div>
        </div>
      </div>`,
      data() { return { name: '', email: '', password: '', roll: '', branch: '', cgpa: '', year: '' }; },
      methods: {
        async register() {
          if (this.cgpa && (isNaN(parseFloat(this.cgpa)) || parseFloat(this.cgpa) < 0 || parseFloat(this.cgpa) > 10)) {
            alert("CGPA must be between 0 and 10");
            return;
          }
          if (this.year && (isNaN(parseInt(this.year)) || parseInt(this.year) < 2000)) {
            alert("Invalid graduation year");
            return;
          }
          try {
            await axios.post('/api/register/student', {
              name: this.name, email: this.email, password: this.password,
              roll_number: this.roll, branch: this.branch, cgpa: parseFloat(this.cgpa) || null,
              year: parseInt(this.year) || null
            });
            alert('Registration successful. Please login.');
            this.$router.push('/login');
          } catch (e) { alert(e.response?.data?.msg || 'Error'); }
        }
      }
    };

    const RegisterCompany = {
      template: `
      <div class="row justify-content-center">
        <div class="col-md-6">
          <router-link to="/" class="text-decoration-none d-inline-flex align-items-center gap-1" style="color: #6c757d;">
            ${backArrowSvg} Back to Home
          </router-link>
          <div class="card p-4 shadow-sm mt-2">
            <h3 style="color: var(--accent);">Company Registration</h3>
            <form @submit.prevent="register">
              <div class="mb-3"><input v-model="name" class="form-control" placeholder="Company Name" required></div>

          <div v-if="view==='reports'">

              <button class="list-group-item list-group-item-action" @click="downloadReport('drives')">Placement Drives CSV</button>
              <button class="list-group-item list-group-item-action" @click="downloadReport('applications')">Student Applications CSV</button>

        </div>`,
      data() {
        return {
          stats: { total_students: 0, total_companies: 0, total_drives: 0, pending_companies: 0, pending_drives: 0 },
          companies: [], drives: [], students: [],
          view: 'companies',
          companySearch: '', companyFilter: 'all',
          driveSearch: '', driveFilter: 'all',
          studentSearch: '', studentFilter: 'all',
          selectedCompany: null,
          companyDrives: [],
          selectedDriveId: null,
          selectedDriveApplicants: [],
          selectedDriveDetail: null,
          selectedDriveApplications: [],
          selectedStudent: null,
          studentApplications: [],
          editingCompany: null
        };
      },
      computed: {
        filteredCompanies() {
          let result = this.companies;
          if (this.companySearch) {
            result = result.filter(c =>
              c.name.toLowerCase().includes(this.companySearch.toLowerCase())
            );
          }
          return result;
        },
        filteredStudents() {
          let result = this.students;
          if (this.studentSearch) {
            result = result.filter(s =>
              s.name.toLowerCase().includes(this.studentSearch.toLowerCase()) ||
              s.roll_number.toLowerCase().includes(this.studentSearch.toLowerCase())
            );
          }
          return result;
        }
      },
      watch: {
        companyFilter() { this.fetchCompanies(); },
        driveFilter() { this.fetchDrives(); },
        driveSearch() { this.fetchDrives(); },
        studentFilter() { this.fetchStudents(); },
        studentSearch() { this.fetchStudents(); }
      },
      async mounted() {
        await this.fetchStats();
        this.fetchCompanies();
        this.fetchDrives();
        this.fetchStudents();
      },
      methods: {
        capitalize(str) {
          if (!str) return '';
          return str.charAt(0).toUpperCase() + str.slice(1);
        },
        async fetchStats() {
          const { data } = await axios.get('/api/admin/dashboard');
          this.stats = data;
        },
        async fetchCompanies() {
          const params = { filter: this.companyFilter };
          if (this.companySearch) params.q = this.companySearch;
          const { data } = await axios.get('/api/admin/companies', { params });
          this.companies = data;
        },
        async fetchDrives() {
          const params = { filter: this.driveFilter };
          if (this.driveSearch) params.q = this.driveSearch;
          const { data } = await axios.get('/api/admin/drives', { params });
          this.drives = data;
        },
        async fetchStudents() {
          const params = { filter: this.studentFilter };
          if (this.studentSearch) params.q = this.studentSearch;
          const { data } = await axios.get('/api/admin/students', { params });
          this.students = data;
        },
        async approveCompany(id) {
          await axios.put(`/api/admin/companies/${id}/approve`);
          const c = this.companies.find(c => c.c_id === id);
          if (c) c.approved = true;
          this.fetchStats();
        },
        async rejectCompany(id) {
          if (confirm('Are you sure you want to reject this company?')) {
            await axios.delete(`/api/admin/companies/${id}/reject`);
            this.companies = this.companies.filter(c => c.c_id !== id);
            this.fetchStats();
          }
        },
        async deleteCompany(id) {
          if (confirm('Are you sure you want to delete this company?')) {
            await axios.delete(`/api/admin/companies/${id}`);
            this.companies = this.companies.filter(c => c.c_id !== id);
            this.fetchStats();
          }
        },
        async toggleCompanyActive(id) {
          await axios.put(`/api/admin/companies/${id}/toggle-active`);
          const c = this.companies.find(c => c.c_id === id);
          if (c) c.active = !c.active;
        },
        async toggleCompanyBlacklist(id) {
          await axios.put(`/api/admin/companies/${id}/toggle-blacklist`);
          const c = this.companies.find(c => c.c_id === id);
          if (c) c.blacklisted = !c.blacklisted;
        },
        async approveDrive(id) {
          await axios.put(`/api/admin/drives/${id}/approve`);
          const d = this.drives.find(d => d.p_id === id);
          if (d) d.status = 'approved';
          this.fetchStats();
        },
        async closeDrive(id) {
          await axios.put(`/api/admin/drives/${id}/close`);
          const d = this.drives.find(d => d.p_id === id);
          if (d) d.status = 'closed';
        },
        async toggleStudentActive(id) {
          await axios.put(`/api/admin/students/${id}/toggle-active`);
          const s = this.students.find(s => s.s_id === id);
          if (s) s.active = !s.active;
          this.fetchStats();
        },
        async toggleStudentBlacklist(id) {
          await axios.put(`/api/admin/students/${id}/toggle-blacklist`);
          const s = this.students.find(s => s.s_id === id);
          if (s) s.blacklisted = !s.blacklisted;
        },
        async deleteStudent(id) {
          if (confirm('Are you sure you want to delete this student?')) {
            await axios.delete(`/api/admin/students/${id}`);
            this.students = this.students.filter(s => s.s_id !== id);
            this.fetchStats();
          }
        },
        async editCompany(companyId) {
          const { data } = await axios.get(`/api/admin/companies/${companyId}`);
          this.editingCompany = {
            c_id: data.c_id,
            name: data.name,
            industry: data.industry,
            location: data.location,
            description: data.description,
            website: data.website,
            hr_contact: data.hr_contact
          };
        },
        async updateCompany() {
          await axios.put(`/api/admin/companies/${this.editingCompany.c_id}`, {
            name: this.editingCompany.name,
            industry: this.editingCompany.industry,
            location: this.editingCompany.location,
            description: this.editingCompany.description,
            website: this.editingCompany.website,
            hr_contact: this.editingCompany.hr_contact
          });
          this.editingCompany = null;
          this.fetchCompanies();
        },
        async viewCompanyDetails(companyId) {
          const { data } = await axios.get(`/api/admin/companies/${companyId}`);
          this.selectedCompany = data;
          const drivesRes = await axios.get(`/api/admin/companies/${companyId}/drives`);
          this.companyDrives = drivesRes.data;
          this.selectedDriveApplicants = [];
          this.selectedDriveId = null;
        },
        async viewDriveApplications(driveId) {
          if (this.selectedDriveId === driveId) {
            this.selectedDriveId = null;
            this.selectedDriveApplicants = [];
            return;
          }
          this.selectedDriveId = driveId;
          const { data } = await axios.get(`/api/admin/drives/${driveId}/applications`);
          this.selectedDriveApplicants = data;
        },
        async viewDriveDetail(driveId) {
          const { data } = await axios.get(`/api/admin/drives/${driveId}`);
          this.selectedDriveDetail = data;
          const appsRes = await axios.get(`/api/admin/drives/${driveId}/applications`);
          this.selectedDriveApplications = appsRes.data;
        },
        async viewStudentDetails(studentId) {
          const { data } = await axios.get(`/api/admin/students/${studentId}`);
          this.selectedStudent = data;
          const appsRes = await axios.get(`/api/admin/students/${studentId}/applications`);
          this.studentApplications = appsRes.data;
        },
        resetCompanyFilters() {
          this.companySearch = '';
          this.companyFilter = 'all';
        },
        resetDriveFilters() {
          this.driveSearch = '';
          this.driveFilter = 'all';
        },
        resetStudentFilters() {
          this.studentSearch = '';
          this.studentFilter = 'all';
        },
        async downloadReport(type) {
          try {
            const response = await axios.get(`/api/admin/report/${type}`, { responseType: 'blob' });
            const url = window.URL.createObjectURL(new Blob([response.data]));
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', `${type}_report.csv`);
            document.body.appendChild(link);
            link.click();
            link.remove();
            window.URL.revokeObjectURL(url);
          } catch (e) {
            alert('Download failed');
          }
        },
        async loadAnalytics() {
          try {
            const { data } = await axios.get('/api/admin/chart-data');
            const ctx1 = document.getElementById('funnelChart')?.getContext('2d');
            if (ctx1) {
              new Chart(ctx1, {
                type: 'bar',
                data: {
                  labels: ['Applied', 'Shortlisted', 'Selected', 'Rejected'],
                  datasets: [{
                    label: 'Applications',
                    data: [data.funnel.applied, data.funnel.shortlisted, data.funnel.selected, data.funnel.rejected],
                    backgroundColor: ['#D46087', '#8C7BB8', '#6092C1', '#E8A317']
                  }]
                },
                options: { responsive: true, maintainAspectRatio: false }
              });
            }
            const ctx2 = document.getElementById('companyChart')?.getContext('2d');
            if (ctx2) {
              const labels = data.company_drives.map(i => i.company);
              const values = data.company_drives.map(i => i.drives);
              const pastelColors = [
                "#4E79A7", "#F28E2B", "#E15759", "#76B7B2", "#59A14F",
                "#EDC948", "#B07AA1", "#9C755F", "#5DA5DA", "#F17CB0",
                "#60BD68", "#B2912F", "#B276B2", "#DECF3F", "#F15854",
                "#4D4D4D", "#1F77B4", "#FF7F0E", "#2CA02C", "#D62728",
                "#9467BD", "#8C564B", "#17BECF", "#BCBD22", "#393B79",
                "#637939", "#8C6D31", "#843C39", "#7B4173", "#3182BD",
                "#31A354", "#756BB1", "#E6550D", "#41AB5D", "#A55194",
                "#66C2A5", "#FC8D62", "#8DA0CB", "#E78AC3", "#A6D854",
                "#FFD92F", "#E5C494", "#1B9E77", "#D95F02", "#7570B3",
                "#E7298A", "#66A61E", "#E6AB02", "#3288BD", "#9E0142"
              ];
              const bgColors = labels.map((_, idx) => pastelColors[idx % pastelColors.length]);
              new Chart(ctx2, {
                type: 'pie',
                data: {
                  labels: labels,
                  datasets: [{
                    data: values,
                    backgroundColor: bgColors
                  }]
                },
                options: { responsive: true, maintainAspectRatio: false }
              });
            }
            const ctx3 = document.getElementById('monthlyAppsChart')?.getContext('2d');
            if (ctx3 && data.monthly_applications.labels.length) {
              new Chart(ctx3, {
                type: 'line',
                data: {
                  labels: data.monthly_applications.labels,
                  datasets: [{
                    label: 'Applications / Month',
                    data: data.monthly_applications.data,
                    borderColor: '#7FAFD4',
                    backgroundColor: 'rgba(127,175,212,0.2)',
                    fill: true
                  }]
                },
                options: { responsive: true, maintainAspectRatio: false }
              });
            }
            const ctx4 = document.getElementById('skillChart')?.getContext('2d');
            if (ctx4 && data.skill_demand.labels.length) {

                type: 'bar',
                data: {

                  }]
                },
                options: {
                  indexAxis: 'y',
                  responsive: true,
                  maintainAspectRatio: false
                }
              });
            }
          } catch (e) { console.error(e); }
        }

        formatCategory(key) {
          const map = {
            process: 'Interview Process', difficulty: 'Interview Difficulty',
            culture: 'Culture', compensation: 'Compensation', career: 'Career',
            work_life: 'Work/Life', senior_mgmt: 'Senior Mgmt', diversity: 'Diversity'
          };
          return map[key] || key;
        },
        async fetchDashboard() {
          try {
            const res = await axios.get('/api/company/dashboard');
            this.companyName = res.data.company_name;
            this.approved = res.data.approved;
            this.is_active = res.data.is_active;
            this.activeDrives = res.data.active_drives;
            this.closedDrives = res.data.closed_drives;
          } catch (e) {
            alert(e.response?.data?.msg || 'Error fetching dashboard');
          }
        },
        async fetchRatings() {
          try {
            const res = await axios.get('/api/company/ratings');
            this.ratings = res.data;
          } catch (e) { }
        },
        async fetchReviews() {
          try {
            const res = await axios.get('/api/company/reviews');
            this.companyReviews = res.data;
          } catch (e) { }
        },
        async updateProfile() {
          try {
            await axios.put('/api/company/profile', this.profileForm);
            alert('Profile updated');
            this.showProfile = false;
          } catch (e) { alert(e.response?.data?.msg); }
        },
        async createDrive() {
          if (!this.newDrive.title) { alert('Job title is required'); return; }
          const cgpa = parseFloat(this.newDrive.cgpa_min);
          if (this.newDrive.cgpa_min && (isNaN(cgpa) || cgpa < 0 || cgpa > 10)) {
            alert('CGPA min must be between 0 and 10'); return;
          }
          try {
            const deadline = this.newDrive.deadline ? new Date(this.newDrive.deadline).toISOString() : null;
            await axios.post('/api/company/drives', {
              title: this.newDrive.title,
              description: this.newDrive.description,
              branch: this.newDrive.branch,
              cgpa_min: cgpa || null,
              year: this.newDrive.year,
              deadline: deadline,
              required_skills: this.newDrive.required_skills,
              preferred_skills: this.newDrive.preferred_skills,
              technologies: this.newDrive.technologies,
              experience: this.newDrive.experience
            });
            alert('Drive created, pending approval');
            this.newDrive = { title: '', description: '', branch: '', cgpa_min: '', year: '', deadline: '', required_skills: '', preferred_skills: '', technologies: '', experience: '' };
            this.showCreate = false;
            this.fetchDashboard();
          } catch (e) {
            alert(e.response?.data?.msg || 'Error creating drive');
          }
        },
        toggleRow(driveId, type) {
          if (this.expandedRow === driveId && this.expandedType === type) {
            this.expandedRow = null;
            this.expandedType = '';
            return;
          }
          this.expandedRow = driveId;
          this.expandedType = type;
          if (type === 'applicants') {
            this.fetchApplicants(driveId);
          } else if (type === 'edit') {
            const drive = this.activeDrives.concat(this.closedDrives).find(d => d.p_id === driveId);
            this.editingDrive = {
              p_id: drive.p_id,
              title: drive.title,
              description: drive.description || '',
              branch: drive.branch || '',
              cgpa_min: drive.cgpa_min || '',
              year: drive.year || '',
              deadline: drive.deadline ? drive.deadline.substring(0, 16) : '',
              required_skills: drive.required_skills || '',
              preferred_skills: drive.preferred_skills || '',
              technologies: drive.technologies || '',
              experience: drive.experience || ''
            };
          }
        },
        async fetchApplicants(driveId) {
          try {
            const res = await axios.get(`/api/company/drives/${driveId}/applications`);
            this.applicants = res.data.map(a => ({ ...a, newStatus: '', packageInput: '' }));
          } catch (e) {
            alert(e.response?.data?.msg || 'Error fetching applicants');
            this.expandedRow = null;
          }
        },
        onStatusChange(applicant) {
          if (applicant.newStatus !== 'selected') {
            applicant.packageInput = '';
          }
        },
        async updateDrive() {
          const cgpa = parseFloat(this.editingDrive.cgpa_min);
          if (this.editingDrive.cgpa_min && (isNaN(cgpa) || cgpa < 0 || cgpa > 10)) {
            alert('CGPA min must be between 0 and 10'); return;
          }
          try {
            const payload = {
              title: this.editingDrive.title,
              description: this.editingDrive.description,
              branch: this.editingDrive.branch,
              cgpa_min: cgpa || null,
              year: this.editingDrive.year,
              deadline: this.editingDrive.deadline ? new Date(this.editingDrive.deadline).toISOString() : null,
              required_skills: this.editingDrive.required_skills,
              preferred_skills: this.editingDrive.preferred_skills,
              technologies: this.editingDrive.technologies,
              experience: this.editingDrive.experience
            };
            await axios.put(`/api/company/drives/${this.editingDrive.p_id}`, payload);
            alert('Drive updated');
            this.expandedRow = null;
            this.fetchDashboard();
          } catch (e) {
            alert(e.response?.data?.msg || 'Error updating drive');
          }
        },
        async deleteDrive(driveId) {
          if (!confirm('Are you sure you want to delete this drive?')) return;
          try {
            await axios.delete(`/api/company/drives/${driveId}`);
            alert('Drive deleted');
            this.fetchDashboard();
          } catch (e) {
            alert(e.response?.data?.msg || 'Error deleting drive');
          }
        },
        async updateStatus(applicant) {
          if (!applicant.newStatus) return;
          try {
            const payload = { status: applicant.newStatus };
            if (applicant.newStatus === 'selected' && applicant.packageInput) {
              payload.package = applicant.packageInput;
            }
            await axios.put(`/api/company/applications/${applicant.a_id}`, payload);
            alert('Status updated');
            this.fetchApplicants(this.expandedRow);
          } catch (e) {
            alert(e.response?.data?.msg || 'Error updating status');
          }
        },
        viewResume(url) {
          const token = localStorage.getItem('token');
          const fullUrl = url + (url.includes('?') ? '&' : '?') + 'jwt=' + encodeURIComponent(token);
          window.open(fullUrl, '_blank');
        },
        async toggleDriveStatus(driveId) {
          try {
            await axios.put(`/api/company/drives/${driveId}/toggle-status`);
            this.fetchDashboard();
          } catch (e) {
            alert(e.response?.data?.msg || 'Error toggling drive status');
          }
        },
        showAtsDetails(applicant) {
          this.atsModal = {
            student_name: applicant.student_name,
            ats_score: applicant.ats_score,
            ats_match_percentage: applicant.ats_match_percentage,
            ats_matched_skills: applicant.ats_matched_skills,
            ats_missing_skills: applicant.ats_missing_skills,
            ats_explanation: applicant.ats_explanation
          };
        },
        async viewStudentProfile(studentId) {
          try {
            const { data } = await axios.get(`/api/company/student/${studentId}`);
            const token = localStorage.getItem('token');
            const resumeUrl = data.resume_path ? `/api/student/resume/${studentId}?jwt=${encodeURIComponent(token)}` : null;
            this.profileModal = { ...data, resume_url: resumeUrl };
          } catch (e) {
            alert(e.response?.data?.msg || 'Error fetching student profile');
          }
        }
      }
    };

    const StudentDashboard = {
      template: `
        <div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 style="color: var(--tertiary);">Welcome, {{ studentName }}</h2>
            <button class="btn btn-sm btn-primary" @click="showEditProfile = !showEditProfile">{{ showEditProfile ? 'Close Profile' : 'Edit Profile' }}</button>
          </div>
          <div v-if="!is_active" class="alert alert-warning">Your account is currently deactivated. You cannot apply to drives or modify data.</div>
          <div v-if="showEditProfile" class="card p-3 mb-3">
            <h5>Edit Profile</h5>
            <form @submit.prevent="updateProfile" enctype="multipart/form-data">
              <div class="row">
                <div class="col-md-6"><div class="mb-3"><input v-model="editProfile.name" class="form-control" placeholder="Name"></div></div>
                <div class="col-md-6"><div class="mb-3"><input v-model="editProfile.roll_number" class="form-control" placeholder="Roll Number"></div></div>
              </div>
              <div class="row">
                <div class="col-md-6"><div class="mb-3"><input v-model="editProfile.branch" class="form-control" placeholder="Branch"></div></div>
                <div class="col-md-6"><div class="mb-3"><input v-model="editProfile.cgpa" type="number" step="0.01" min="0" max="10" class="form-control" placeholder="CGPA"></div></div>
              </div>
              <div class="row">
                <div class="col-md-6"><div class="mb-3"><input v-model="editProfile.year" type="number" min="2000" max="2099" class="form-control" placeholder="Year"></div></div>
                <div class="col-md-6"><div class="mb-3"><input v-model="editProfile.skills" class="form-control" placeholder="Skills (comma separated)"></div></div>
              </div>
              <div class="mb-3"><label>Upload Resume</label><input type="file" @change="onResumeFile" class="form-control" :disabled="!is_active"></div>
              <button type="submit" class="btn btn-success" :disabled="!is_active">Save</button>
              <button class="btn btn-secondary ms-2" @click="showEditProfile = false">Cancel</button>
            </form>
          </div>

          <div class="row mb-3">
            <div class="col"><div class="card stat-card card-students"><div class="card-body"><h5>Available</h5><h2>{{ stats.available }}</h2></div></div></div>
            <div class="col"><div class="card stat-card card-drives"><div class="card-body"><h5>Applied</h5><h2>{{ stats.applied }}</h2></div></div></div>
            <div class="col"><div class="card stat-card" style="background-color: #fff3cd;"><div class="card-body"><h5>Shortlisted</h5><h2>{{ stats.shortlisted }}</h2></div></div></div>
            <div class="col"><div class="card stat-card" style="background-color: #d4edda;"><div class="card-body"><h5>Selected</h5><h2>{{ stats.selected }}</h2></div></div></div>
            <div class="col"><div class="card stat-card" style="background-color: #f8d7da;"><div class="card-body"><h5>Rejected</h5><h2>{{ stats.rejected }}</h2></div></div></div>
          </div>

          <h4>Available Drives</h4>
          <div class="row mt-3">
            <div class="col-md-3 mb-3" v-for="drive in eligibleDrives" :key="drive.p_id">
              <div class="card p-3 h-100 shadow-sm">
                <h5>{{ drive.title }}</h5>
                <p class="text-muted mb-1">{{ drive.company_name }}</p>
                <div v-if="drive.company_ratings && drive.company_ratings.total > 0" class="mb-1">
                  <small><strong>Interview: </strong></small>
                  <span style="color: black;">{{ drive.company_ratings.avg_interview }}/5</span>
                  <span style="color: var(--warning);">
                    <template v-for="i in 5">
                      <span v-if="i <= Math.round(drive.company_ratings.avg_interview)">&#9733;</span>
                      <span v-else>&#9734;</span>
                    </template>
                  </span>
                  <small style="color: black;"> ({{ drive.company_ratings.interview_count || 0 }})</small><br/>
                  <small><strong>Company: </strong></small>
                  <span style="color: black;">{{ drive.company_ratings.avg_company }}/5</span>
                  <span style="color: var(--warning);">
                    <template v-for="i in 5">
                      <span v-if="i <= Math.round(drive.company_ratings.avg_company)">&#9733;</span>
                      <span v-else>&#9734;</span>
                    </template>
                  </span>
                  <small style="color: black;"> ({{ drive.company_ratings.company_count || 0 }})</small>
                </div>
                <div v-else class="mb-1"><small class="text-muted">No reviews yet</small></div>
                <p class="mb-1"><strong>Deadline:</strong> {{ drive.deadline || 'N/A' }}</p>
                <p v-if="drive.applied" class="mb-1"><span :class="drive.status === 'selected' ? 'text-success' : 'text-status-applied'">Status: {{ drive.status }}</span></p>
                <button v-if="!drive.applied" class="btn btn-sm btn-primary mt-2" @click="applyDrive(drive.p_id)" :disabled="!is_active">Apply</button>
                <button class="btn btn-sm btn-outline-info mt-1" @click="togglePanel(drive.p_id, 'job')">View Job Details</button>
                <button class="btn btn-sm btn-outline-info mt-1" @click="togglePanel(drive.p_id, 'ats')">ATS Check</button>
                <button class="btn btn-sm btn-outline-info mt-1" @click="togglePanel(drive.p_id, 'company')">Company Details</button>
              </div>
            </div>
          </div>
          <div v-if="eligibleDrives.length === 0" class="text-muted">No eligible drives available.</div>

          <div v-if="activePanel" class="card p-3 mt-3">
            <div v-if="activePanel.type === 'job'">
              <h5>Job Details - {{ activePanel.drive.title }}</h5>
              <p><strong>Description:</strong> {{ activePanel.drive.description }}</p>
              <p><strong>Required Skills:</strong> {{ activePanel.drive.required_skills || 'N/A' }}</p>
              <p><strong>Preferred Skills:</strong> {{ activePanel.drive.preferred_skills || 'N/A' }}</p>
              <p><strong>Technologies:</strong> {{ activePanel.drive.technologies || 'N/A' }}</p>
              <p><strong>Experience:</strong> {{ activePanel.drive.experience || 'N/A' }}</p>
            </div>
            <div v-if="activePanel.type === 'ats'">
              <h5>ATS Score for {{ activePanel.drive.title }}</h5>
              <div v-if="atsScore !== null">
                <p>Your resume matches <strong>{{ atsScore }}%</strong> of the job requirements.</p>
                <p>Matched Skills: {{ atsMatched.join(', ') }}</p>
              </div>
              <button class="btn btn-sm btn-outline-info" @click="atsCheck(activePanel.drive.p_id)" :disabled="!is_active">Run ATS Check</button>
            </div>
            <div v-if="activePanel.type === 'company'">
              <h5>{{ activePanel.drive.company_name }}</h5>
              <p><strong>Industry:</strong> {{ activePanel.drive.company_detail?.industry || 'N/A' }}</p>
              <p><strong>Location:</strong> {{ activePanel.drive.company_detail?.location || 'N/A' }}</p>
              <p><strong>Description:</strong> {{ activePanel.drive.company_detail?.description || 'N/A' }}</p>
              <p><strong>Website:</strong> <a :href="activePanel.drive.company_detail?.website" target="_blank">{{ activePanel.drive.company_detail?.website }}</a></p>
              <div v-if="activePanel.drive.company_detail?.ratings?.total > 0">
                <p><strong>Interview Rating: </strong>
                  <span style="color: black;">{{ activePanel.drive.company_detail.ratings.avg_interview }}/5</span>
                  <span style="color: var(--warning);">
                    <template v-for="i in 5">
                      <span v-if="i <= Math.round(activePanel.drive.company_detail.ratings.avg_interview)">&#9733;</span>
                      <span v-else>&#9734;</span>
                    </template>
                  </span>
                  <span style="color: black;"> ({{ activePanel.drive.company_detail.ratings.interview_count || 0 }} reviews)</span>
                </p>
                <p><strong>Company Rating: </strong>
                  <span style="color: black;">{{ activePanel.drive.company_detail.ratings.avg_company }}/5</span>
                  <span style="color: var(--warning);">
                    <template v-for="i in 5">
                      <span v-if="i <= Math.round(activePanel.drive.company_detail.ratings.avg_company)">&#9733;</span>
                      <span v-else>&#9734;</span>
                    </template>
                  </span>
                  <span style="color: black;"> ({{ activePanel.drive.company_detail.ratings.company_count || 0 }} reviews)</span>
                </p>
              </div>
              <div v-else class="text-muted">No reviews yet.</div>
            </div>
            <button class="btn btn-sm btn-secondary mt-2" @click="activePanel = null">Close</button>
          </div>

          <hr>
          <h4>My Applications</h4>
          <div class="table-responsive">
            <table class="table table-striped">
              <thead><tr><th>Drive</th><th>Company</th><th>Status</th><th>Date</th></tr></thead>
              <tbody>
                <tr v-for="a in applications" :key="a.a_id">
                  <td>{{ a.drive_title }}</td>
                  <td>{{ a.company_name }}</td>
                  <td :class="{'status-text': true, 'status-selected': a.status === 'selected'}">{{ capitalize(a.status) }}</td>
                  <td>{{ a.applied_date }}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="text-end mt-2 mb-3">
            <button class="btn btn-sm btn-accent me-1" @click="exportCSV">Export CSV (Email)</button>
            <button class="btn btn-sm btn-accent" @click="downloadCSV">Download CSV</button>
          </div>

          <div v-if="showReviewModal" class="card p-3 mt-3">
            <h5>{{ reviewType === 'interview' ? (existingReviewId ? 'Update Interview Review' : 'Rate Interview Process') : (existingReviewId ? 'Update Company Review' : 'Rate Company') }}</h5>
            <div v-for="cat in currentCategories" :key="cat.key" class="row mb-2">
              <label class="col-sm-4 col-form-label">{{ cat.label }}</label>
              <div class="col-sm-8">
                <select v-model="subRatings[cat.key]" class="form-select form-select-sm">
                  <option disabled value="0">-</option>
                  <option v-for="i in 5" :value="i">{{ i }}</option>
                </select>
              </div>
            </div>
            <textarea v-model="reviewComment" class="form-control" placeholder="Optional comment"></textarea>
            <div class="mt-2">
              <button class="btn btn-success me-1" @click="submitReview" :disabled="!is_active">Submit</button>
              <button class="btn btn-secondary" @click="showReviewModal = false">Cancel</button>
            </div>
          </div>

          <hr>
          <h4>Placement History</h4>
          <div class="table-responsive">
            <table class="table table-striped">
              <thead><tr><th>Company</th><th>Role</th><th>Package</th><th>Placement Date</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody>
                <tr v-for="h in history" :key="h.date + h.position">
                  <td>{{ h.company_name }}</td>
                  <td>{{ h.position }}</td>
                  <td>{{ h.package || 'N/A' }}</td>
                  <td>{{ h.placement_date || 'N/A' }}</td>
                  <td :class="{'status-text': true, 'status-selected': h.status === 'selected'}">{{ capitalize(h.status) }}</td>
                  <td>
                    <button v-if="h.status === 'selected'" class="btn btn-sm btn-outline-info me-1" @click="openReview(h, 'company')" :disabled="!is_active">{{ h.company_review ? 'Update Company Review' : 'Review Company' }}</button>
                    <button v-if="h.status === 'shortlisted'" class="btn btn-sm btn-outline-info me-1" @click="openReview(h, 'interview')" :disabled="!is_active">{{ h.interview_review ? 'Update Interview Review' : 'Review Interview' }}</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div v-if="history.length === 0" class="text-muted">No placement history yet.</div>

          <hr>
          <h4>My Reviews</h4>
          <div class="table-responsive">
            <table class="table table-striped">
              <thead><tr><th>Company</th><th>Type</th><th>Sub‑details</th><th>Comment</th><th>Date</th></tr></thead>
              <tbody>
                <tr v-for="r in myReviews" :key="r.r_id">
                  <td>{{ r.company_name }}</td>
                  <td>{{ capitalize(r.review_type) }}</td>
                  <td>
                    <small v-if="r.sub_ratings">
                      <span v-for="(val, key) in r.sub_ratings" :key="key">{{ formatCategory(key) }}: {{ val }}<br/></span>
                    </small>
                  </td>
                  <td>{{ r.comment }}</td>
                  <td>{{ r.date }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>`,
      data() {
        return {
          studentName: '',
          is_active: true,
          stats: { available: 0, applied: 0, shortlisted: 0, selected: 0, rejected: 0 },
          eligibleDrives: [],
          applications: [],
          history: [],
          profile: {},
          myReviews: [],
          showEditProfile: false,
          editProfile: {},
          resumeFile: null,
          showReviewModal: false,
          reviewTarget: null,
          reviewType: '',
          subRatings: {},
          reviewComment: '',
          existingReviewId: null,
          atsScore: null,
          atsMatched: [],
          activePanel: null,
          interviewCategories: [{ key: 'process', label: 'Interview Process' }, { key: 'difficulty', label: 'Interview Difficulty' }],
          companyCategories: [
            { key: 'culture', label: 'Culture & Values' },
            { key: 'compensation', label: 'Compensation & Benefits' },
            { key: 'career', label: 'Career Opportunities' },
            { key: 'work_life', label: 'Work/Life Balance' },
            { key: 'senior_mgmt', label: 'Senior Management' },
            { key: 'diversity', label: 'Diversity & Inclusion' },
            { key: 'process', label: 'Interview Process' },
            { key: 'difficulty', label: 'Interview Difficulty' }
          ]
        };
      },
      computed: {
        currentCategories() {
          return this.reviewType === 'interview' ? this.interviewCategories : this.companyCategories;
        }
      },
      async mounted() {
        await this.fetchDashboard();
        this.fetchApplications();
        this.fetchHistory();
        this.fetchProfile();
        this.fetchMyReviews();
      },
      methods: {
        capitalize(str) {
          if (!str) return '';
          return str.charAt(0).toUpperCase() + str.slice(1);
        },
        formatCategory(key) {
          const map = {
            process: 'Interview Process', difficulty: 'Interview Difficulty',
            culture: 'Culture', compensation: 'Compensation', career: 'Career',
            work_life: 'Work/Life', senior_mgmt: 'Senior Mgmt', diversity: 'Diversity'
          };
          return map[key] || key;
        },
        async fetchDashboard() {
          const res = await axios.get('/api/student/dashboard');
          this.studentName = res.data.student_name;
          this.is_active = res.data.is_active;
          this.eligibleDrives = res.data.drives;
          this.stats = res.data.stats;
        },
        async fetchApplications() {
          const res = await axios.get('/api/student/applications');
          this.applications = res.data;
        },
        async fetchHistory() {
          const res = await axios.get('/api/student/history');
          this.history = res.data;
        },
        async fetchProfile() {
          const res = await axios.get('/api/student/profile');
          this.profile = res.data;
          this.editProfile = { ...res.data };
        },
        async fetchMyReviews() {
          const res = await axios.get('/api/student/reviews');
          this.myReviews = res.data;
        },
        async applyDrive(driveId) {
          try {
            await axios.post(`/api/student/apply/${driveId}`);
            alert('Application submitted');
            this.fetchDashboard();
            this.fetchApplications();
          } catch (e) {
            alert(e.response?.data?.msg || 'Error applying');
          }
        },
        async togglePanel(driveId, type) {
          if (this.activePanel && this.activePanel.drive.p_id === driveId && this.activePanel.type === type) {
            this.activePanel = null;
            return;
          }
          const drive = this.eligibleDrives.find(d => d.p_id === driveId);
          if (type === 'company') {
            try {
              const { data } = await axios.get(`/api/company/public/${drive.company_id}`);
              drive.company_detail = data;
            } catch (e) { alert(e.response?.data?.msg); }
          }
          this.activePanel = { drive, type };
          if (type === 'ats') {
            this.atsScore = null;
            this.atsMatched = [];
          }
        },
        async atsCheck(driveId) {
          try {
            const res = await axios.post('/api/student/ats-check', { drive_id: driveId });
            this.atsScore = res.data.score;
            this.atsMatched = res.data.matched_skills;
          } catch (e) { alert(e.response?.data?.msg); }
        },
        openReview(historyItem, type) {
          this.reviewTarget = historyItem;
          this.reviewType = type;
          const existing = type === 'company' ? historyItem.company_review : historyItem.interview_review;
          if (existing) {
            this.subRatings = { ...existing.sub_ratings };
            this.reviewComment = existing.comment || '';
            this.existingReviewId = existing.r_id;
          } else {
            this.subRatings = {};
            this.reviewComment = '';
            this.existingReviewId = null;
          }
          this.showReviewModal = true;
        },
        async submitReview() {
          if (!Object.values(this.subRatings).some(v => v > 0)) {
            alert('Please provide at least one rating.');
            return;
          }
          try {
            await axios.post('/api/student/review', {
              company_id: this.reviewTarget.company_id,
              drive_id: this.reviewTarget.drive_id,
              review_type: this.reviewType,
              sub_ratings: this.subRatings,
              comment: this.reviewComment,
            });
            alert('Review ' + (this.existingReviewId ? 'updated' : 'submitted'));
            this.showReviewModal = false;
            this.fetchApplications();
            this.fetchMyReviews();
            this.fetchHistory();
          } catch (e) { alert(e.response?.data?.msg); }
        },
        async updateProfile() {
          const cgpa = parseFloat(this.editProfile.cgpa);
          if (this.editProfile.cgpa && (isNaN(cgpa) || cgpa < 0 || cgpa > 10)) {
            alert('CGPA must be between 0 and 10'); return;
          }
          const formData = new FormData();
          formData.append('name', this.editProfile.name);
          formData.append('roll_number', this.editProfile.roll_number);
          formData.append('branch', this.editProfile.branch);
          formData.append('cgpa', this.editProfile.cgpa);
          formData.append('year', this.editProfile.year);
          formData.append('skills', this.editProfile.skills);
          if (this.resumeFile) {
            formData.append('resume', this.resumeFile);
          }
          try {
            await axios.put('/api/student/profile', formData);
            alert('Profile updated');
            this.showEditProfile = false;
            this.resumeFile = null;
            this.fetchProfile();
          } catch (e) { alert(e.response?.data?.msg || 'Error updating profile'); }
        },
        onResumeFile(e) {
          this.resumeFile = e.target.files[0];
        },
        viewResume() {
          const token = localStorage.getItem('token');
          const url = `/api/student/resume/${this.profile.s_id}?jwt=${encodeURIComponent(token)}`;
          window.open(url, '_blank');
        },
        async exportCSV() {
          try {
            await axios.post('/api/student/export-csv');
            alert('CSV export started. You will receive an email shortly.');
          } catch (e) {
            alert(e.response?.data?.msg || 'Export failed');
          }
        },
        async downloadCSV() {
          try {
            const response = await axios.get('/api/student/export-csv-download', {
              responseType: 'blob'
            });
            const url = window.URL.createObjectURL(new Blob([response.data]));
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'applications.csv');
            document.body.appendChild(link);
            link.click();
            link.remove();
            window.URL.revokeObjectURL(url);
          } catch (e) {
            alert(e.response?.data?.msg || 'Download failed');
          }
        }
      }
    };


    const routes = [
      { path: '/', component: PublicDashboard },
      { path: '/login', component: Login },
      { path: '/register/student', component: RegisterStudent },
      { path: '/register/company', component: RegisterCompany },
      { path: '/admin', component: AdminDashboard, meta: { role: 'admin' } },
      { path: '/company', component: CompanyDashboard, meta: { role: 'company' } },
      { path: '/student', component: StudentDashboard, meta: { role: 'student' } },
    ];

    const router = createRouter({ history: createWebHashHistory(), routes });

    router.beforeEach((to, from, next) => {
      const role = localStorage.getItem('role');
      if (to.path === '/') {
        if (role) {
          next('/' + role);
        } else {
          next();
        }
      } else if (to.meta.role && role !== to.meta.role) {
        next('/login');
      } else {
        next();
      }
    });

    const app = createApp({
      data() {
        return {
          token: localStorage.getItem('token'),
          role: localStorage.getItem('role') || ''
        };
      },
      computed: {
        navbarClass() {
          if (!this.token) return 'navbar-guest';
          if (this.role === 'admin') return 'navbar-admin';
          if (this.role === 'company') return 'navbar-company';
          if (this.role === 'student') return 'navbar-student';
          return '';
        }
      },
      methods: {
        updateAuth() {
          this.token = localStorage.getItem('token');
          this.role = localStorage.getItem('role') || '';
        },
        logout() {
          localStorage.removeItem('token');
          localStorage.removeItem('role');
          this.token = null;
          this.role = '';
          this.$router.push('/');
        }
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    app.use(router);
    app.mount('#app');
    {% endraw %}
  </script>
</body>
