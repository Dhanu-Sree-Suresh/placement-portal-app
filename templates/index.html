<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placement Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #54B39A;
      --secondary: #6092C1;
      --accent: #D46087;
      --tertiary: #8C7BB8;
      --quaternary: #7FAFD4;
      --success: #7FB8A4;
      --warning: #E8A317;
      --danger: #D97C6F;
      --info: #6B8DAF;
      --low: #7FB8A4;
      --medium: #E8A317;
      --high: #D97C6F;
      --critical: #A30006;
      --text-dark-gray: #2c3e50;
      --text-white: #ffffff;
      --card-student: #d4e9e2;
      --card-company: #d6e2f0;
      --card-drive: #e3d7f5;
      --card-pending: #fbe8c6;
    }

    body {
      background: #f8f9fa;
      color: var(--text-dark-gray);
    }

    .navbar-admin {
      background-color: #ffffff !important;
      border-bottom: 2px solid var(--primary);
    }

    .navbar-admin .navbar-brand {
      color: var(--primary) !important;
      font-weight: 700;
    }

    .navbar-company {
      background-color: #ffffff !important;
      border-bottom: 2px solid var(--secondary);
    }

    .navbar-company .navbar-brand {
      color: var(--secondary) !important;
      font-weight: 700;
    }

    .navbar-student {
      background-color: #ffffff !important;
      border-bottom: 2px solid var(--tertiary);
    }

    .navbar-student .navbar-brand {
      color: var(--tertiary) !important;
      font-weight: 700;
    }

    .navbar-guest {
      background-color: #ffffff !important;
      border-bottom: 2px solid var(--accent);
    }

    .navbar-guest .navbar-brand {
      color: var(--accent) !important;
      font-weight: 700;
    }

    .navbar-guest .btn-outline-danger {
      border-color: var(--accent);
      color: var(--accent);
    }

    .navbar-guest .btn-outline-danger:hover {
      background-color: var(--accent);
      color: #fff;
    }

    .navbar-brand {
      font-weight: bold;
    }

    .btn-primary {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background-color: #3e8b74;
      border-color: #3e8b74;
    }

    .btn-primary:active,
    .btn-primary:focus,
    .btn-primary:focus-visible {
      background-color: #2f6e5a !important;
      border-color: #2f6e5a !important;
      box-shadow: 0 0 0 0.2rem rgba(84, 179, 154, 0.3) !important;
    }

    .btn-accent {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-accent:hover {
      background-color: #b84a6e;
      border-color: #b84a6e;
      color: #fff;
    }

    .btn-accent:active,
    .btn-accent:focus {
      background-color: #9b3e5c !important;
      border-color: #9b3e5c !important;
      box-shadow: 0 0 0 0.2rem rgba(212, 96, 135, 0.3) !important;
    }

    .btn-secondary {
      background-color: var(--secondary);
      border-color: var(--secondary);
    }

    .btn-secondary:hover {
      background-color: #4a75a0;
      border-color: #4a75a0;
    }

    .btn-success {
      background-color: var(--success);
      border-color: var(--success);
    }

    .btn-success:hover {
      background-color: #5d8c7a;
      border-color: #5d8c7a;
    }

    .btn-warning {
      background-color: var(--warning);
      border-color: var(--warning);
      color: #fff;
    }

    .btn-warning:hover {
      background-color: #c48e14;
      border-color: #c48e14;
      color: #fff;
    }

    .btn-danger {
      background-color: var(--danger);
      border-color: var(--danger);
    }

    .btn-danger:hover {
      background-color: #b85d52;
      border-color: #b85d52;
    }

    .btn-outline-primary,
    .btn-outline-secondary,
    .btn-outline-success,
    .btn-outline-danger,
    .btn-outline-warning,
    .btn-outline-info,
    .btn-outline-company,
    .btn-outline-drive,
    .btn-outline-student {
      background-color: transparent;
      transition: all 0.15s ease-in-out;
    }

    .btn-outline-primary {
      color: var(--primary);
      border-color: var(--primary);
    }

    .btn-outline-primary:hover {
      background-color: var(--primary);
      color: var(--text-dark-gray);
      border-color: var(--primary);
    }

    .btn-outline-primary:active,
    .btn-outline-primary.active,
    .btn-outline-primary.selected,
    .btn-outline-primary:focus-visible {
      background-color: var(--primary) !important;
      color: #fff !important;
      border-color: var(--primary) !important;
    }

    .btn-outline-success {
      color: var(--success);
      border-color: var(--success);
    }

    .btn-outline-success:hover {
      background-color: var(--success);
      color: var(--text-dark-gray);
      border-color: var(--success);
    }

    .btn-outline-success:active,
    .btn-outline-success.active,
    .btn-outline-success.selected {
      background-color: var(--success) !important;
      color: #fff !important;
      border-color: var(--success) !important;
    }

    .btn-outline-info {
      color: var(--info);
      border-color: var(--info);
    }

    .btn-outline-info:hover {
      background-color: var(--info);
      color: var(--text-dark-gray);
      border-color: var(--info);
    }

    .btn-outline-info:active,
    .btn-outline-info.active,
    .btn-outline-info.selected {
      background-color: var(--info) !important;
      color: #fff !important;
      border-color: var(--info) !important;
    }

    .btn-outline-company {
      background-color: transparent;
      color: #6b8cb3;
      border-color: #6b8cb3;
    }

    .btn-outline-company:hover {
      background-color: #7f9fc4;
      color: var(--text-dark-gray);
      border-color: #7f9fc4;
    }

    .btn-outline-company.active,
    .btn-outline-company.selected {
      background-color: #7f9fc4 !important;
      color: #fff !important;
      border-color: #7f9fc4 !important;
    }

    .btn-outline-drive {
      background-color: transparent;
      color: #9575c1;
      border-color: #9575c1;
    }

    .btn-outline-drive:hover {
      background-color: #a88bcf;
      color: var(--text-dark-gray);
      border-color: #a88bcf;
    }

    .btn-outline-drive.active,
    .btn-outline-drive.selected {
      background-color: #a88bcf !important;
      color: #fff !important;
      border-color: #a88bcf !important;
    }

    .btn-outline-student {
      background-color: transparent;
      color: #709e87;
      border-color: #709e87;
    }

    .btn-outline-student:hover {
      background-color: #84b39c;
      color: var(--text-dark-gray);
      border-color: #84b39c;
    }

    .btn-outline-student.active,
    .btn-outline-student.selected {
      background-color: #84b39c !important;
      color: #fff !important;
      border-color: #84b39c !important;
    }

    .btn-outline-danger {
      color: var(--danger);
      border-color: var(--danger);
    }

    .btn-outline-danger:hover {
      background-color: var(--danger);
      color: var(--text-dark-gray);
      border-color: var(--danger);
    }

    .btn-outline-danger:active,
    .btn-outline-danger.active,
    .btn-outline-danger.selected {
      background-color: var(--danger) !important;
      color: #fff !important;
      border-color: var(--danger) !important;
    }

    .btn-company {
      background-color: #7f9fc4;
      border-color: #7f9fc4;
      color: var(--text-white);
    }

    .btn-company:hover {
      background-color: #6b8cb3;
      border-color: #6b8cb3;
      color: var(--text-dark-gray);
    }

    .btn-drive {
      background-color: #a88bcf;
      border-color: #a88bcf;
      color: var(--text-white);
    }

    .btn-drive:hover {
      background-color: #9575c1;
      border-color: #9575c1;
      color: var(--text-dark-gray);
    }

    .btn-student {
      background-color: #84b39c;
      border-color: #84b39c;
      color: var(--text-white);
    }

    .btn-student:hover {
      background-color: #709e87;
      border-color: #709e87;
      color: var(--text-dark-gray);
    }

    .card {
      border: none;
      border-radius: 10px;
    }

    .table-responsive {
      margin-bottom: 1.5rem;
    }

    .stat-card {
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      height: 100%;
    }

    .stat-card .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-card h5 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
      color: var(--text-dark-gray);
      font-weight: 700;
    }

    .stat-card h2 {
      font-size: 2rem;
      margin: 0;
      font-weight: 700;
      color: var(--text-dark-gray);
    }

    .card-students {
      background-color: var(--card-student);
    }

    .card-companies {
      background-color: var(--card-company);
    }

    .card-drives {
      background-color: var(--card-drive);
    }

    .card-pending {
      background-color: var(--card-pending);
    }
  </style>
</head>

<body>
  <div id="app">
    <nav class="navbar navbar-expand-lg navbar-light shadow-sm" :class="navbarClass" v-if="true">
      <div class="container">
        <a class="navbar-brand" href="#">Placement Portal</a>
        <div class="navbar-nav ms-auto">
          <button v-if="token" class="btn btn-sm btn-outline-danger" @click="logout">Logout</button>
        </div>
      </div>
    </nav>
    <div class="container mt-4">
      <router-view></router-view>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    {% raw %}
    const { createApp, ref, computed } = Vue;
    const { createRouter, createWebHashHistory } = VueRouter;

    axios.interceptors.request.use(config => {
      const token = localStorage.getItem('token');
      if (token) config.headers.Authorization = `Bearer ${token}`;
      return config;
    });

    const Login = {
      template: `
      <div class="row justify-content-center">
        <div class="col-md-4">
          <div class="card p-4 shadow-sm">
            <h3 class="text-center" style="color: var(--accent);">Login</h3>
            <form @submit.prevent="doLogin">
              <div class="mb-3"><input v-model="email" type="email" class="form-control" placeholder="Email" required></div>
              <div class="mb-3"><input v-model="password" type="password" class="form-control" placeholder="Password" required minlength="6"></div>
              <button type="submit" class="btn btn-accent w-100">Login</button>
            </form>
            <p class="mt-3 text-center">New student? <router-link to="/register/student">Register</router-link></p>
            <p class="text-center">Company? <router-link to="/register/company">Register</router-link></p>
          </div>
        </div>
      </div>`,
      data() { return { email: '', password: '' }; },
      methods: {
        async doLogin() {
          try {
            const res = await axios.post('/api/login', { email: this.email, password: this.password });
            localStorage.setItem('token', res.data.access_token);
            localStorage.setItem('role', res.data.role);
            this.$root.updateAuth();
            this.$router.push('/' + res.data.role);
          } catch (e) {
            alert(e.response?.data?.msg || 'Login failed');
          }
        }
      }
    };

    const RegisterStudent = {
      template: `
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card p-4 shadow-sm">
            <h3 style="color: var(--accent);">Student Registration</h3>
            <form @submit.prevent="register">
              <div class="mb-3"><input v-model="name" class="form-control" placeholder="Full Name" required></div>
              <div class="mb-3"><input v-model="email" type="email" class="form-control" placeholder="Email" required></div>
              <div class="mb-3"><input v-model="password" type="password" class="form-control" placeholder="Password" required minlength="6"></div>
              <div class="mb-3"><input v-model="roll" class="form-control" placeholder="Roll Number"></div>
              <div class="mb-3"><input v-model="branch" class="form-control" placeholder="Branch"></div>
              <div class="mb-3"><input v-model="cgpa" class="form-control" placeholder="CGPA" type="number" step="0.01" min="0" max="10"></div>
              <div class="mb-3"><input v-model="year" class="form-control" placeholder="Graduation Year" type="number" min="2000" max="2099"></div>
              <button class="btn btn-accent w-100">Register</button>
            </form>
            <p class="mt-3 text-center">Already have an account? <router-link to="/">Login</router-link></p>
          </div>
        </div>
      </div>`,
      data() { return { name: '', email: '', password: '', roll: '', branch: '', cgpa: '', year: '' }; },
      methods: {
        async register() {
          if (this.cgpa && (isNaN(parseFloat(this.cgpa)) || parseFloat(this.cgpa) < 0 || parseFloat(this.cgpa) > 10)) {
            alert("CGPA must be between 0 and 10");
            return;
          }
          if (this.year && (isNaN(parseInt(this.year)) || parseInt(this.year) < 2000)) {
            alert("Invalid graduation year");
            return;
          }
          try {
            await axios.post('/api/register/student', {
              name: this.name, email: this.email, password: this.password,
              roll_number: this.roll, branch: this.branch, cgpa: parseFloat(this.cgpa) || null,
              year: parseInt(this.year) || null
            });
            alert('Registration successful. Please login.');
            this.$router.push('/');
          } catch (e) { alert(e.response?.data?.msg || 'Error'); }
        }
      }
    };

    const RegisterCompany = {
      template: `
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card p-4 shadow-sm">
            <h3 style="color: var(--accent);">Company Registration</h3>
            <form @submit.prevent="register">
              <div class="mb-3"><input v-model="name" class="form-control" placeholder="Company Name" required></div>
              <div class="mb-3"><input v-model="email" type="email" class="form-control" placeholder="HR Email" required></div>
              <div class="mb-3"><input v-model="password" type="password" class="form-control" placeholder="Password" required minlength="6"></div>
              <div class="mb-3"><input v-model="industry" class="form-control" placeholder="Industry"></div>
              <div class="mb-3"><input v-model="location" class="form-control" placeholder="Location"></div>
              <div class="mb-3"><textarea v-model="desc" class="form-control" placeholder="Description"></textarea></div>
              <button class="btn btn-accent w-100">Register</button>
            </form>
            <p class="mt-3 text-center">Already have an account? <router-link to="/">Login</router-link></p>
          </div>
        </div>
      </div>`,
      data() { return { name: '', email: '', password: '', industry: '', location: '', desc: '' }; },
      methods: {
        async register() {
          try {
            await axios.post('/api/register/company', {
              name: this.name, email: this.email, password: this.password,
              industry: this.industry, location: this.location, description: this.desc
            });
            alert('Company registered. Await admin approval.');
            this.$router.push('/');
          } catch (e) { alert(e.response?.data?.msg || 'Error'); }
        }
      }
    };

    const AdminDashboard = {
      template: `
        <div>
          <h2 style="color: var(--primary);">Admin Dashboard</h2>
          <div class="row">
            <div class="col-md-3 mb-3">
              <div class="card stat-card card-students">
                <div class="card-body">
                  <h5>Students</h5>
                  <h2>{{ stats.total_students }}</h2>
                </div>
              </div>
            </div>
            <div class="col-md-3 mb-3">
              <div class="card stat-card card-companies">
                <div class="card-body">
                  <h5>Companies</h5>
                  <h2>{{ stats.total_companies }}</h2>
                </div>
              </div>
            </div>
            <div class="col-md-3 mb-3">
              <div class="card stat-card card-drives">
                <div class="card-body">
                  <h5>Drives</h5>
                  <h2>{{ stats.total_drives }}</h2>
                </div>
              </div>
            </div>
            <div class="col-md-3 mb-3">
              <div class="card stat-card card-pending">
                <div class="card-body">
                  <h5>Pending</h5>
                  <p style="margin:0; color: var(--text-dark-gray);">Companies: {{ stats.pending_companies }}<br>
                    Drives: {{ stats.pending_drives }}</p>
                </div>
              </div>
            </div>
          </div>

          <div class="mt-4 mb-3">
            <button class="btn me-2" :class="view==='companies' ? 'btn-company' : 'btn-outline-company'" @click="view='companies'">Companies</button>
            <button class="btn me-2" :class="view==='drives' ? 'btn-drive' : 'btn-outline-drive'" @click="view='drives'">Drives</button>
            <button class="btn" :class="view==='students' ? 'btn-student' : 'btn-outline-student'" @click="view='students'">Students</button>
          </div>

          <div v-if="view==='companies'">
            <h4>Companies</h4>
            <div class="row mb-2">
              <div class="col-md-4">
                <input v-model="companySearch" class="form-control" placeholder="Search companies by name">
              </div>
              <div class="col-md-4">
                <select v-model="companyFilter" class="form-select">
                  <option value="all">All</option>
                  <option value="approved">Approved</option>
                  <option value="unapproved">Unapproved</option>
                  <option value="active">Active</option>
                  <option value="inactive">Deactivated</option>
                </select>
              </div>
              <div class="col-md-2">
                <button class="btn btn-sm btn-outline-info" @click="resetCompanyFilters">Reset</button>
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-striped">
                <thead><tr><th>Name</th><th>Email</th><th>Approved</th><th>Active</th><th>Actions</th></tr></thead>
                <tbody>
                  <tr v-for="c in filteredCompanies" :key="c.c_id">
                    <td>{{ c.name }}</td>
                    <td>{{ c.email }}</td>
                    <td><span :class="c.approved ? 'text-success' : 'text-danger'">{{ c.approved ? 'Yes' : 'No' }}</span></td>
                    <td>{{ c.active ? 'Active' : 'Deactivated' }}</td>
                    <td>
                      <button class="btn btn-sm btn-outline-info me-1" @click="viewCompanyDetails(c.c_id)">View Details</button>
                      <button v-if="!c.approved" class="btn btn-sm btn-success me-1" @click="approveCompany(c.c_id)">Approve</button>
                      <button class="btn btn-sm btn-warning me-1" @click="toggleCompanyActive(c.c_id)">{{ c.active ? 'Deactivate' : 'Activate' }}</button>
                      <button v-if="!c.approved" class="btn btn-sm btn-danger" @click="rejectCompany(c.c_id)">Reject</button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div v-if="selectedCompany" class="card p-3 mt-3">
              <h5>Company Details</h5>
              <p><strong>Name:</strong> {{ selectedCompany.name }}</p>
              <p><strong>Email:</strong> {{ selectedCompany.email }}</p>
              <p><strong>Industry:</strong> {{ selectedCompany.industry }}</p>
              <p><strong>Location:</strong> {{ selectedCompany.location }}</p>
              <p><strong>Description:</strong> {{ selectedCompany.description }}</p>
              <h6>Drives</h6>
              <div v-if="companyDrives.length === 0" class="text-muted">No drives.</div>
              <div v-else class="table-responsive">
                <table class="table table-sm">
                  <thead><tr><th>Title</th><th>Status</th><th>Deadline</th><th>Actions</th></tr></thead>
                  <tbody>
                    <tr v-for="d in companyDrives" :key="d.p_id">
                      <td>{{ d.title }}</td>
                      <td>{{ capitalize(d.status) }}</td>
                      <td>{{ d.deadline || 'N/A' }}</td>
                      <td>
                        <button :class="['btn btn-sm btn-outline-info', { selected: selectedDriveId === d.p_id }]" @click="viewDriveApplications(d.p_id)">View Applicants</button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div v-if="selectedDriveApplicants.length > 0" class="mt-2">
                <h6>Applicants for Drive {{ selectedDriveId }}</h6>
                <table class="table table-sm">
                  <thead><tr><th>Name</th><th>Roll No</th><th>Branch</th><th>CGPA</th><th>Status</th></tr></thead>
                  <tbody>
                    <tr v-for="a in selectedDriveApplicants" :key="a.a_id">
                      <td>{{ a.student_name }}</td>
                      <td>{{ a.roll_number }}</td>
                      <td>{{ a.branch }}</td>
                      <td>{{ a.cgpa }}</td>
                      <td>{{ capitalize(a.status) }}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <button class="btn btn-sm btn-secondary mt-2" @click="selectedCompany = null; companyDrives = []; selectedDriveApplicants = []; selectedDriveId = null">Close</button>
            </div>
          </div>

          <div v-if="view==='drives'">
            <h4>Placement Drives</h4>
            <div class="row mb-2">
              <div class="col-md-4">
                <input v-model="driveSearch" class="form-control" placeholder="Search by title or company">
              </div>
              <div class="col-md-4">
                <select v-model="driveFilter" class="form-select">
                  <option value="all">All</option>
                  <option value="pending">Pending</option>
                  <option value="approved">Approved</option>
                  <option value="closed">Closed</option>
                </select>
              </div>
              <div class="col-md-2">
                <button class="btn btn-sm btn-outline-info" @click="resetDriveFilters">Reset</button>
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-striped">
                <thead><tr><th>Title</th><th>Company</th><th>Status</th><th>Deadline</th><th>Actions</th></tr></thead>
                <tbody>
                  <tr v-for="d in drives" :key="d.p_id">
                    <td>{{ d.title }}</td>
                    <td>{{ d.company_name }}</td>
                    <td>{{ capitalize(d.status) }}</td>
                    <td>{{ d.deadline || 'N/A' }}</td>
                    <td>
                      <button class="btn btn-sm btn-outline-info me-1" @click="viewDriveDetail(d.p_id)">View Details</button>

            );

        async fetchCompanies() {

          this.companies = data;

    const CompanyDashboard = {

                    <td>{{ d.deadline || 'N/A' }}</td>

          </div>

          <div v-if="selectedDrive" class="mt-4">

              <table class="table table-striped">

                    <td>{{ a.cgpa }}</td>

                      <select v-model="a.newStatus" class="form-select form-select-sm d-inline w-auto">

      data() {
        return {
          companyName: '',
          approved: false,
          activeDrives: [],
          closedDrives: [],
          showCreate: false,
          newDrive: { title: '', description: '', branch: '', cgpa_min: '', year: '', deadline: '' },
          selectedDrive: null,
          applicants: [],
          showEdit: false,
          editingDrive: {}
        };
      },
      async mounted() {
        await this.fetchDashboard();
      },
      methods: {
        capitalize(str) {
          if (!str) return '';
          return str.charAt(0).toUpperCase() + str.slice(1);
        },
        async fetchDashboard() {
          try {
            const res = await axios.get('/api/company/dashboard');
            this.companyName = res.data.company_name;
            this.approved = res.data.approved;
            this.activeDrives = res.data.active_drives;
            this.closedDrives = res.data.closed_drives;
          } catch (e) {
            alert(e.response?.data?.msg || 'Error fetching dashboard');
          }
        },
        async createDrive() {
          if (!this.newDrive.title) { alert('Job title is required'); return; }
          const cgpa = parseFloat(this.newDrive.cgpa_min);
          if (this.newDrive.cgpa_min && (isNaN(cgpa) || cgpa < 0 || cgpa > 10)) {
            alert('CGPA min must be between 0 and 10'); return;
          }
          try {
            const deadline = this.newDrive.deadline ? new Date(this.newDrive.deadline).toISOString() : null;
            await axios.post('/api/company/drives', {
              title: this.newDrive.title,
              description: this.newDrive.description,
              branch: this.newDrive.branch,
              cgpa_min: cgpa || null,
              year: this.newDrive.year,
              deadline: deadline
            });
            alert('Drive created, pending approval');
            this.newDrive = { title: '', description: '', branch: '', cgpa_min: '', year: '', deadline: '' };
            this.showCreate = false;
            this.fetchDashboard();
          } catch (e) {
            alert(e.response?.data?.msg || 'Error creating drive');
          }
        },
        editDrive(drive) {
          this.editingDrive = {
            p_id: drive.p_id,
            title: drive.title,
            description: drive.description || '',
            branch: drive.branch || '',
            cgpa_min: drive.cgpa_min || '',
            year: drive.year || '',
            deadline: drive.deadline ? drive.deadline.substring(0, 16) : ''
          };
          this.showEdit = true;
        },
        async updateDrive() {
          const cgpa = parseFloat(this.editingDrive.cgpa_min);
          if (this.editingDrive.cgpa_min && (isNaN(cgpa) || cgpa < 0 || cgpa > 10)) {
            alert('CGPA min must be between 0 and 10'); return;
          }
          try {
            const payload = {
              title: this.editingDrive.title,
              description: this.editingDrive.description,
              branch: this.editingDrive.branch,
              cgpa_min: cgpa || null,
              year: this.editingDrive.year,
              deadline: this.editingDrive.deadline ? new Date(this.editingDrive.deadline).toISOString() : null
            };
            await axios.put(`/api/company/drives/${this.editingDrive.p_id}`, payload);
            alert('Drive updated');
            this.showEdit = false;
            this.fetchDashboard();
          } catch (e) {
            alert(e.response?.data?.msg || 'Error updating drive');
          }
        },
        async deleteDrive(driveId) {
          if (!confirm('Are you sure you want to delete this drive?')) return;
          try {
            await axios.delete(`/api/company/drives/${driveId}`);

            alert(e.response?.data?.msg || 'Error fetching applicants');

        },

          try {
            await axios.put(`/api/company/applications/${applicant.a_id}`, { status: applicant.newStatus });
            alert('Status updated');
            this.viewApplicants(this.selectedDrive);
          } catch (e) {
            alert(e.response?.data?.msg || 'Error updating status');

        },
        async toggleDriveStatus(driveId) {
          try {
            await axios.put(`/api/company/drives/${driveId}/toggle-status`);
            this.fetchDashboard();
          } catch (e) {
            alert(e.response?.data?.msg || 'Error toggling drive status');
          }
        }
      }
    };

              <div class="mb-3"><input v-model="editProfile.name" class="form-control" placeholder="Name"></div>
              <div class="mb-3"><input v-model="editProfile.roll_number" class="form-control" placeholder="Roll Number"></div>
              <div class="mb-3"><input v-model="editProfile.branch" class="form-control" placeholder="Branch"></div>
              <div class="mb-3"><input v-model="editProfile.cgpa" type="number" step="0.01" min="0" max="10" class="form-control" placeholder="CGPA"></div>
              <div class="mb-3"><input v-model="editProfile.year" type="number" min="2000" max="2099" class="form-control" placeholder="Year"></div>
              <div class="mb-3"><input v-model="editProfile.skills" class="form-control" placeholder="Skills (comma separated)"></div>
              <button type="submit" class="btn btn-success">Save</button>
              <button class="btn btn-secondary ms-2" @click="showEditProfile = false">Cancel</button>
            </form>
          </div>
        </div>`,
      data() {
        return {
          studentName: '',
          eligibleDrives: [],
          applications: [],
          history: [],
          profile: {},
          showEditProfile: false,
          editProfile: {}
        };
      },
      async mounted() {
        await this.fetchDashboard();
        this.fetchApplications();
        this.fetchHistory();
        this.fetchProfile();
      },
      methods: {
        capitalize(str) {
          if (!str) return '';
          return str.charAt(0).toUpperCase() + str.slice(1);
        },
        async fetchDashboard() {
          const res = await axios.get('/api/student/dashboard');
          this.studentName = res.data.student_name;
          this.eligibleDrives = res.data.drives;
        },
        async fetchApplications() {
          const res = await axios.get('/api/student/applications');
          this.applications = res.data;
        },
        async fetchHistory() {
          const res = await axios.get('/api/student/history');
          this.history = res.data;
        },
        async fetchProfile() {
          const res = await axios.get('/api/student/profile');
          this.profile = res.data;
          this.editProfile = { ...res.data };
        },
        async applyDrive(driveId) {
          try {
            await axios.post(`/api/student/apply/${driveId}`);
            alert('Application submitted');
            this.fetchDashboard();
            this.fetchApplications();
          } catch (e) {
            alert(e.response?.data?.msg || 'Error applying');
          }
        },
        async updateProfile() {
          const cgpa = parseFloat(this.editProfile.cgpa);
          if (this.editProfile.cgpa && (isNaN(cgpa) || cgpa < 0 || cgpa > 10)) {
            alert('CGPA must be between 0 and 10'); return;
          }
          try {
            await axios.put('/api/student/profile', this.editProfile);
            alert('Profile updated');
            this.showEditProfile = false;
            this.fetchProfile();
          } catch (e) {
            alert(e.response?.data?.msg || 'Error updating profile');
          }
        },
        async exportCSV() {
          try {
            await axios.post('/api/student/export-csv');
            alert('CSV export started. You will receive an email shortly.');
          } catch (e) {
            alert(e.response?.data?.msg || 'Export failed');
          }
        },
        async downloadCSV() {
          try {
            const response = await axios.get('/api/student/export-csv-download', {
              responseType: 'blob'
            });
            const url = window.URL.createObjectURL(new Blob([response.data]));
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'applications.csv');
            document.body.appendChild(link);
            link.click();
            link.remove();
            window.URL.revokeObjectURL(url);
          } catch (e) {
            alert(e.response?.data?.msg || 'Download failed');
          }
        }
      }
    };


    const routes = [
      { path: '/', component: Login },
      { path: '/register/student', component: RegisterStudent },
      { path: '/register/company', component: RegisterCompany },
      { path: '/admin', component: AdminDashboard, meta: { role: 'admin' } },
      { path: '/company', component: CompanyDashboard, meta: { role: 'company' } },
      { path: '/student', component: StudentDashboard, meta: { role: 'student' } },
    ];

    const router = createRouter({ history: createWebHashHistory(), routes });

    router.beforeEach((to, from, next) => {
      const role = localStorage.getItem('role');
      if (to.meta.role && role !== to.meta.role) {
        next('/');
      } else {
        next();
      }
    });

    const app = createApp({
      data() {
        return {
          token: localStorage.getItem('token'),
          role: localStorage.getItem('role') || ''
        };
      },
      computed: {
        navbarClass() {
          if (!this.token) return 'navbar-guest';
          if (this.role === 'admin') return 'navbar-admin';
          if (this.role === 'company') return 'navbar-company';
          if (this.role === 'student') return 'navbar-student';
          return '';
        }
      },
      methods: {
        updateAuth() {
          this.token = localStorage.getItem('token');
          this.role = localStorage.getItem('role') || '';
        },
        logout() {
          localStorage.removeItem('token');
          localStorage.removeItem('role');
          this.token = null;
          this.role = '';
          this.$router.push('/');
        }
      }
    });

    app.use(router);
    app.mount('#app');
    {% endraw %}
  </script>
</body>

</html>
