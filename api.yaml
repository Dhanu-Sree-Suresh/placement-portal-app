info:
  title: Placement Portal API
  description: |
    Comprehensive API for campus placement management.
    Supports three roles: Admin, Company, and Student.
    Authentication uses JWT Bearer tokens.
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        msg:
          type: string
          description: Error message

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        role:
          type: string
          enum: [admin, company, student]

    StudentRegistrationRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        name:
          type: string
        roll_number:
          type: string
        branch:
          type: string
        cgpa:
          type: number
          minimum: 0
          maximum: 10
        year:
          type: integer
        skills:
          type: string

    CompanyRegistrationRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        name:
          type: string
        industry:
          type: string
        location:
          type: string
        description:
          type: string
        website:
          type: string
        hr_contact:
          type: string

    Company:
      type: object
      properties:
        c_id:
          type: integer
        name:
          type: string
        email:
          type: string
        approved:
          type: boolean
        active:
          type: boolean
        blacklisted:
          type: boolean
        industry:
          type: string
        location:
          type: string
        description:
          type: string
        website:
          type: string
        hr_contact:
          type: string

    Student:
      type: object
      properties:
        s_id:
          type: integer
        name:
          type: string
        roll_number:
          type: string
        email:
          type: string
        branch:
          type: string
        cgpa:
          type: number
        year:
          type: integer
        skills:
          type: string
        resume_path:
          type: string
        active:
          type: boolean
        blacklisted:
          type: boolean

    PlacementDrive:
      type: object
      properties:
        p_id:
          type: integer
        title:
          type: string
        description:
          type: string
        branch:
          type: string
        cgpa_min:
          type: number
        year:
          type: string
        deadline:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, approved, closed]
        company_name:
          type: string
        company_id:
          type: integer
        required_skills:
          type: string
        preferred_skills:
          type: string
        technologies:
          type: string
        experience:
          type: string
        closed_by_admin:
          type: boolean

    Application:
      type: object
      properties:
        a_id:
          type: integer
        student_name:
          type: string
        roll_number:
          type: string
        branch:
          type: string
        cgpa:
          type: number
        status:
          type: string
          enum: [applied, shortlisted, selected, rejected]
        applied_date:
          type: string
          format: date-time

    Review:
      type: object
      properties:
        r_id:
          type: integer
        review_type:
          type: string
          enum: [company, interview]
        sub_ratings:
          type: object
          additionalProperties:
            type: integer
        comment:
          type: string
        date:
          type: string
          format: date-time

    CompanyRatings:
      type: object
      properties:
        avg_interview:
          type: number
        avg_company:
          type: number
        total:
          type: integer
        interview_count:
          type: integer
        company_count:
          type: integer
        categories:
          type: object
          additionalProperties:
            type: number

security:
  - bearerAuth: []

paths:
  /api/login:
    post:
      summary: Authenticate user and obtain JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Missing email/password
        "401":
          description: Invalid credentials
        "403":
          description: Account blacklisted

  /api/register/student:
    post:
      summary: Register a new student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentRegistrationRequest"
      responses:
        "201":
          description: Student registered
        "400":
          description: Validation error or missing fields
        "409":
          description: Email already registered

  /api/register/company:
    post:
      summary: Register a new company (pending approval)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRegistrationRequest"
      responses:
        "201":
          description: Company registered pending approval
        "400":
          description: Validation error or missing fields
        "409":
          description: Email already registered

  /api/public/stats:
    get:
      summary: Public statistics (students, companies, drives, placements)
      security: []
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_students:
                    type: integer
                  total_companies:
                    type: integer
                  total_drives:
                    type: integer
                  total_selected:
                    type: integer
                  monthly_selected:
                    type: object
                    properties:
                      labels:
                        type: array
                        items:
                          type: string
                      data:
                        type: array
                        items:
                          type: integer

  /api/company/public/{company_id}:
    get:
      summary: Public company profile and ratings
      security: []
      parameters:
        - name: company_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company public data
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  industry:
                    type: string
                  location:
                    type: string
                  description:
                    type: string
                  website:
                    type: string
                  ratings:
                    $ref: "#/components/schemas/CompanyRatings"
        "404":
          description: Company not found

  /api/admin/dashboard:
    get:
      summary: Admin dashboard statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_students:
                    type: integer
                  total_companies:
                    type: integer
                  total_drives:
                    type: integer
                  pending_companies:
                    type: integer
                  pending_drives:
                    type: integer
        "403":
          description: Forbidden (not admin or blacklisted)

  /api/admin/companies:
    get:
      summary: List companies with optional filter
      security:
        - bearerAuth: []
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, approved, unapproved, active, inactive, blacklisted]
        - name: q
          in: query
          schema:
            type: string
          description: Search by company name
      responses:
        "200":
          description: List of companies
          content:
            application/json:
              type: array
              items:
                $ref: "#/components/schemas/Company"

  /api/admin/companies/{company_id}:
    get:
      summary: Get company details with reviews and ratings
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Company"
                  - type: object
                    properties:
                      reviews:
                        type: array
                        items:
                          $ref: "#/components/schemas/Review"
                      ratings:
                        $ref: "#/components/schemas/CompanyRatings"
        "404":
          description: Company not found
    put:
      summary: Update company details
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                industry:
                  type: string
                location:
                  type: string
                description:
                  type: string
                website:
                  type: string
                hr_contact:
                  type: string
                approved:
                  type: boolean
      responses:
        "200":
          description: Company updated
        "404":
          description: Company not found
    delete:
      summary: Delete company
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company deleted
        "404":
          description: Company not found

  /api/admin/companies/{company_id}/drives:
    get:
      summary: Get all drives for a company
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of drives
          content:
            application/json:
              type: array
              items:
                $ref: "#/components/schemas/PlacementDrive"
        "404":
          description: Company not found

  /api/admin/drives/{drive_id}/applications:
    get:
      summary: Get applications for a drive
      security:
        - bearerAuth: []
      parameters:
        - name: drive_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              type: array
              items:
                $ref: "#/components/schemas/Application"

  /api/admin/companies/{company_id}/approve:
    put:
      summary: Approve company registration
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company approved
        "404":
          description: Company not found

  /api/admin/companies/{company_id}/reject:
    delete:
      summary: Reject and delete company registration
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company registration rejected
        "404":
          description: Company not found

  /api/admin/companies/{company_id}/toggle-active:
    put:
      summary: Toggle company active status
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Status toggled

  /api/admin/companies/{company_id}/toggle-blacklist:
    put:
      summary: Toggle company blacklist status
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Blacklist toggled

  /api/admin/drives:
    get:
      summary: List drives with filters and search
      security:
        - bearerAuth: []
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, pending, approved, closed]
        - name: q
          in: query
          schema:
            type: string
          description: Search by title or company name
      responses:
        "200":
          description: List of drives
          content:
            application/json:
              type: array
              items:
                $ref: "#/components/schemas/PlacementDrive"

  /api/admin/drives/{drive_id}/approve:
    put:
      summary: Approve a placement drive
      security:
        - bearerAuth: []
      parameters:
        - name: drive_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Drive approved
        "400":
          description: Company not approved yet
        "404":
          description: Drive not found

  /api/admin/drives/{drive_id}/close:
    put:
      summary: Close a drive by admin
      security:
        - bearerAuth: []
      parameters:
        - name: drive_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Drive closed

  /api/admin/students:
    get:
      summary: List students with filters and search
      security:
        - bearerAuth: []
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, active, inactive, blacklisted]
        - name: q
          in: query
          schema:
            type: string
          description: Search by name or roll number
      responses:
        "200":
          description: List of students
          content:
            application/json:
              type: array
              items:
                $ref: "#/components/schemas/Student"

  /api/admin/students/{student_id}:
    get:
      summary: Get student details
      security:
        - bearerAuth: []
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Student not found
    delete:
      summary: Delete student
      security:
        - bearerAuth: []
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student deleted

  /api/admin/students/{student_id}/applications:
    get:
      summary: Get all applications for a student
      security:
        - bearerAuth: []
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              type: array
              items:
                type: object
                properties:
                  a_id:
                    type: integer
                  company_name:
                    type: string
                  drive_title:
                    type: string
                  status:
                    type: string
                  applied_date:
                    type: string
                    format: date-time

  /api/admin/drives/{drive_id}:
    get:
      summary: Get drive details
      security:
        - bearerAuth: []
      parameters:
        - name: drive_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Drive details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementDrive"

  /api/admin/students/{student_id}/toggle-active:
    put:
      summary: Toggle student active status
      security:
        - bearerAuth: []
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Status toggled

  /api/admin/students/{student_id}/toggle-blacklist:
    put:
      summary: Toggle student blacklist status
      security:
        - bearerAuth: []
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Blacklist toggled

  /api/admin/chart-data:
    get:
      summary: Analytics data for charts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Chart data
          content:
            application/json:
              schema:
                type: object
                properties:
                  funnel:
                    type: object
                    properties:
                      applied:
                        type: integer
                      shortlisted:
                        type: integer
                      selected:
                        type: integer
                      rejected:
                        type: integer
                  company_drives:
                    type: array
                    items:
                      type: object
                      properties:
                        company:
                          type: string
                        drives:
                          type: integer
                  monthly_applications:
                    type: object
                    properties:
                      labels:
                        type: array
                        items:
                          type: string
                      data:
                        type: array
                        items:
                          type: integer
                  skill_demand:
                    type: object
                    properties:
                      labels:
                        type: array
                        items:
                          type: string
                      data:
                        type: array
                        items:
                          type: integer

  /api/admin/report/{report_type}:
    get:
      summary: Download CSV report
      security:
        - bearerAuth: []
      parameters:
        - name: report_type
          in: path
          required: true
          schema:
            type: string
            enum: [placements, companies, drives, applications, stats]
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /api/company/dashboard:
    get:
      summary: Company dashboard with active/closed drives
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Company dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  company_name:
                    type: string
                  approved:
                    type: boolean
                  is_active:
                    type: boolean
                  active_drives:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlacementDrive"
                  closed_drives:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlacementDrive"

  /api/company/profile:
    get:
      summary: Get company profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  industry:
                    type: string
                  location:
                    type: string
                  description:
                    type: string
                  website:
                    type: string
                  hr_contact:
                    type: string
    put:
      summary: Update company profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                industry:
                  type: string
                location:
                  type: string
                description:
                  type: string
                website:
                  type: string
                hr_contact:
                  type: string
      responses:
        "200":
          description: Profile updated

  /api/company/drives:
    post:
      summary: Create a new placement drive
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                description:
                  type: string
                branch:
                  type: string
                cgpa_min:
                  type: number
                  minimum: 0
                  maximum: 10
                year:
                  type: string
                deadline:
                  type: string
                  format: date-time
                required_skills:
                  type: string
                preferred_skills:
                  type: string
                technologies:
                  type: string
                experience:
                  type: string
      responses:
        "201":
          description: Drive created pending approval
        "400":
          description: Validation error
        "403":
          description: Company not approved or deactivated

  /api/company/drives/{drive_id}:
    put:
      summary: Update a drive
      security:
        - bearerAuth: []
      parameters:
        - name: drive_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                branch:
                  type: string
                cgpa_min:
                  type: number
                  minimum: 0
                  maximum: 10
                year:
                  type: string
                deadline:
                  type: string
                  format: date-time
                required_skills:
                  type: string
                preferred_skills:
                  type: string
                technologies:
                  type: string
                experience:
                  type: string
      responses:
        "200":
          description: Drive updated
        "403":
          description: Unauthorized or company not owner
        "404":
          description: Drive not found
    delete:
      summary: Delete a drive
      security:
        - bearerAuth: []
      parameters:
        - name: drive_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Drive deleted
        "403":
          description: Unauthorized

  /api/company/drives/{drive_id}/toggle-status:
    put:
      summary: Toggle drive status between approved and closed (unless admin closed)
      security:
        - bearerAuth: []
      parameters:
        - name: drive_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Status changed
        "403":
          description: Unauthorized or admin-closed cannot reopen

  /api/company/drives/{drive_id}/applications:
    get:
      summary: Get applicants for a drive with ATS scores
      security:
        - bearerAuth: []
      parameters:
        - name: drive_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of applicants with ATS data
          content:
            application/json:
              type: array
              items:
                type: object
                properties:
                  a_id:
                    type: integer
                  student_id:
                    type: integer
                  student_name:
                    type: string
                  roll_number:
                    type: string
                  branch:
                    type: string
                  cgpa:
                    type: number
                  status:
                    type: string
                  applied_date:
                    type: string
                    format: date-time
                  resume_url:
                    type: string
                  ats_score:
                    type: integer
                  ats_matched_skills:
                    type: array
                    items:
                      type: string
                  ats_missing_skills:
                    type: array
                    items:
                      type: string
                  ats_match_percentage:
                    type: integer
                  ats_explanation:
                    type: string

  /api/company/applications/{app_id}:
    put:
      summary: Update application status (shortlist/select/reject)
      security:
        - bearerAuth: []
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [shortlisted, selected, rejected]
                package:
                  type: string
      responses:
        "200":
          description: Status updated
        "403":
          description: Unauthorized
        "404":
          description: Application not found

  /api/company/ratings:
    get:
      summary: Get aggregated company ratings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Company ratings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyRatings"

  /api/company/reviews:
    get:
      summary: Get all reviews for the company
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              type: array
              items:
                $ref: "#/components/schemas/Review"

  /api/company/student/{student_id}:
    get:
      summary: View student profile (for company)
      security:
        - bearerAuth: []
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /api/student/dashboard:
    get:
      summary: Student dashboard with eligible drives and stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  student_name:
                    type: string
                  is_active:
                    type: boolean
                  drives:
                    type: array
                    items:
                      type: object
                      properties:
                        p_id:
                          type: integer
                        title:
                          type: string
                        company_name:
                          type: string
                        description:
                          type: string
                        branch:
                          type: string
                        cgpa_min:
                          type: number
                        year:
                          type: string
                        deadline:
                          type: string
                        applied:
                          type: boolean
                        status:
                          type: string
                        company_id:
                          type: integer
                        company_ratings:
                          $ref: "#/components/schemas/CompanyRatings"
                        required_skills:
                          type: string
                        preferred_skills:
                          type: string
                        technologies:
                          type: string
                        experience:
                          type: string
                  stats:
                    type: object
                    properties:
                      available:
                        type: integer
                      applied:
                        type: integer
                      shortlisted:
                        type: integer
                      selected:
                        type: integer
                      rejected:
                        type: integer

  /api/student/apply/{drive_id}:
    post:
      summary: Apply for a placement drive
      security:
        - bearerAuth: []
      parameters:
        - name: drive_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Applied successfully
        "400":
          description: Drive not open or already applied
        "403":
          description: Not eligible or deactivated

  /api/student/applications:
    get:
      summary: Get student's applications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              type: array
              items:
                type: object
                properties:
                  a_id:
                    type: integer
                  drive_title:
                    type: string
                  company_name:
                    type: string
                  status:
                    type: string
                  applied_date:
                    type: string
                  company_id:
                    type: integer
                  drive_id:
                    type: integer
                  has_review:
                    type: boolean
                  review_type:
                    type: string

  /api/student/profile:
    get:
      summary: Get student profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
    put:
      summary: Update student profile (supports multipart for resume upload)
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                roll_number:
                  type: string
                branch:
                  type: string
                cgpa:
                  type: number
                year:
                  type: integer
                skills:
                  type: string
                resume:
                  type: string
                  format: binary
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                roll_number:
                  type: string
                branch:
                  type: string
                cgpa:
                  type: number
                year:
                  type: integer
                skills:
                  type: string
      responses:
        "200":
          description: Profile updated

  /api/student/upload-resume:
    post:
      summary: Upload resume file
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [resume]
              properties:
                resume:
                  type: string
                  format: binary
      responses:
        "200":
          description: Resume uploaded
        "400":
          description: No file or invalid

  /api/student/resume/{student_id}:
    get:
      summary: Serve resume file (allowed for student, company, admin)
      security:
        - bearerAuth: []
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resume file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          description: Unauthorized
        "404":
          description: No resume uploaded

  /api/student/history:
    get:
      summary: Get placement history (selected drives)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of placements
          content:
            application/json:
              type: array
              items:
                type: object
                properties:
                  company_name:
                    type: string
                  position:
                    type: string
                  status:
                    type: string
                  package:
                    type: string
                  placement_date:
                    type: string
                  applied_date:
                    type: string
                  company_id:
                    type: integer
                  drive_id:
                    type: integer
                  company_review:
                    $ref: "#/components/schemas/Review"
                  interview_review:
                    $ref: "#/components/schemas/Review"

  /api/student/export-csv:
    post:
      summary: Trigger CSV export as email (Celery task)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Task started, email will be sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                  task_id:
                    type: string

  /api/student/export-csv-download:
    get:
      summary: Download CSV directly
      security:
        - bearerAuth: []
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /api/student/ats-check:
    post:
      summary: Perform ATS skill match for a drive
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [drive_id]
              properties:
                drive_id:
                  type: integer
      responses:
        "200":
          description: ATS result
          content:
            application/json:
              schema:
                type: object
                properties:
                  score:
                    type: integer
                  matched_skills:
                    type: array
                    items:
                      type: string
                  total_skills:
                    type: integer

  /api/student/review:
    post:
      summary: Submit or update a review (company or interview)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id, review_type, sub_ratings]
              properties:
                company_id:
                  type: integer
                drive_id:
                  type: integer
                review_type:
                  type: string
                  enum: [company, interview]
                sub_ratings:
                  type: object
                  additionalProperties:
                    type: integer
                comment:
                  type: string
      responses:
        "200":
          description: Review submitted/updated

  /api/student/reviews:
    get:
      summary: Get all reviews submitted by the student
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              type: array
              items:
                $ref: "#/components/schemas/Review"
